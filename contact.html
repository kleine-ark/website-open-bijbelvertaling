    <style>
        body { display: block; background: #f8f6f2; }
        .page { max-width: 600px; margin: 0 auto; padding: 60px 24px 80px; font-family: var(--font-body); }
        .page h1 { font-family: var(--font-cursive); font-size: 36px; color: var(--navy); font-weight: 400; margin-bottom: 24px; }
        .page p { line-height: 1.8; margin-bottom: 14px; color: #333; }
        .page a { color: var(--gold); }
        .contact-card {
            background: #fff;
            border: 1px solid #e5e1d8;
            border-radius: 8px;
            padding: 24px;
            margin: 24px 0;
        }
        .contact-card .name { font-size: 18px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
        .contact-card .email { font-size: 15px; color: var(--gold); }
        /* Donker thema */
        :root[data-theme="donker"] body { background: var(--bg-page); }
        :root[data-theme="donker"] .page h1 { color: var(--text-primary); }
        :root[data-theme="donker"] .page p { color: var(--text-primary); }
        :root[data-theme="donker"] .contact-card { background: var(--bg-surface) !important; border-color: var(--border-default) !important; }
        :root[data-theme="donker"] .contact-card .name { color: var(--text-primary); }
        :root[data-theme="donker"] .contact-card a[style*="navy"] { color: var(--text-primary) !important; }
    </style>
    <script>(function(){try{var s=localStorage.getItem("sv2026_vertaalopties");var t=s?(JSON.parse(s).thema||"auto"):"auto";if(t==="auto"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"donker":"licht";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
