name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@main
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/openvertaling.nl/site
      deploy_source: .
      # Bouwt downloads/ (EPUB + brondata-zip + index.json) tijdens de deploy,
      # zodat de uitgaven altijd gelijk lopen met de tekst en er geen binaire
      # bestanden in git terechtkomen.
      build_command: python scripts/build_naslag_teksten.py && python scripts/build_naslag_verzen.py && python scripts/build_illustraties.py && python scripts/build_downloads.py
      rsync_excludes: |
        .git/
        .github/
        .claude/
        audio/
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
