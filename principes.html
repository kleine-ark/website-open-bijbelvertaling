    <style>
        .stats-page { max-width: 1000px; margin: 0 auto; padding: 20px 20px 60px; font-family: var(--font-body); }
        .stats-page h1 { color: var(--navy); font-family: var(--font-cursive); font-size: 32px; font-weight: 400; margin-bottom: 4px; }
        .stats-page .subtitle { color: var(--teal); font-size: 14px; margin-bottom: 30px; }
        .stats-page h2 { color: var(--navy); font-size: 20px; margin: 32px 0 12px; border-bottom: 2px solid var(--gold); padding-bottom: 6px; }
        .back-link { display: inline-block; margin-bottom: 16px; color: var(--teal); text-decoration: none; font-size: 14px; }
        .back-link:hover { color: var(--gold); }

        .principe-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 8px 0;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }
        .principe-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .principe-card.expanded { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }

        .principe-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .principe-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-body);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .cat-N { background: #dbeafe; color: #1e40af; }
        .cat-A { background: #d1fae5; color: #065f46; }
        .cat-G { background: #fef3c7; color: #92400e; }
        .cat-W { background: #ffedd5; color: #9a3412; }
        .cat-V { background: #ede9fe; color: #5b21b6; }
        .cat-S { background: #fce7f3; color: #9d174d; }
        .cat-O { background: #f3f4f6; color: #374151; }

        .principe-change {
            font-size: 14px;
            color: var(--navy);
        }
        .principe-change .old { text-decoration: line-through; color: #b91c1c; }
        .principe-change .arrow { color: #999; margin: 0 4px; }
        .principe-change .new { color: #15803d; font-weight: 500; }

        .principe-toelichting {
            font-size: 12px;
            color: #6b7280;
            margin-left: auto;
        }

        .principe-count {
            font-size: 11px;
            color: var(--teal);
            background: rgba(146,182,180,0.12);
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .principe-verzen {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            max-height: 400px;
            overflow-y: auto;
        }
        .principe-card.expanded .principe-verzen { display: block; }

        .vers-item {
            display: flex;
            gap: 10px;
            padding: 4px 0;
            font-size: 13px;
            line-height: 1.5;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .vers-item:last-child { border-bottom: none; }
        .vers-ref {
            color: var(--teal);
            text-decoration: none;
            font-weight: 500;
            white-space: nowrap;
            min-width: 120px;
        }
        .vers-ref:hover { color: var(--gold); }
        .vers-diff .diff-old { text-decoration: line-through; color: #b91c1c; }
        .vers-diff .diff-new { color: #15803d; }

        .loading-msg {
            text-align: center;
            padding: 40px;
            color: var(--teal);
            font-size: 14px;
        }

        .expand-icon {
            font-size: 10px;
            color: #999;
            transition: transform 0.2s;
        }
        .principe-card.expanded .expand-icon { transform: rotate(90deg); }
    </style>
