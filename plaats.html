<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#142e42">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaats in Gods Woord — Open Vertaling</title>
    <meta name="description" content="Bronpagina met plaatsgegevens en Bijbelse verwijzingen bij de Open Vertaling.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display:block; background:#f8f6f2; }
        .page { max-width:900px; padding:30px 24px 80px; font-family:var(--font-body); }
        .kruimel { color:var(--teal); font-size:14px; margin:0 0 18px; }
        .kruimel a, .tekstverwijzingen a, .bron a { color:var(--gold); text-decoration:none; }
        .kruimel a:hover, .tekstverwijzingen a:hover, .bron a:hover { text-decoration:underline; }
        h1, h2 { color:var(--navy); font-family:var(--font-cursive); font-weight:400; }
        h1 { font-size:38px; margin:0 0 5px; }
        h2 { font-size:26px; margin:32px 0 10px; border-bottom:2px solid var(--gold); padding-bottom:6px; }
        .intro { color:#555; font-size:15px; line-height:1.6; max-width:680px; }
        .gegevens { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin:22px 0; }
        .gegeven { background:#fff; border:1px solid #e5e1d8; border-radius:8px; padding:11px 13px; }
        .gegeven dt { color:var(--teal); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
        .gegeven dd { margin:4px 0 0; color:#333; font-size:14px; }
        .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; }
        .z-zeker { background:rgba(92,184,92,.18); color:#3d7a3d; }
        .z-waarschijnlijk { background:rgba(203,164,73,.20); color:#8a6d1f; }
        .z-onzeker { background:rgba(150,150,150,.20); color:#666; }
        .kaart-cta { display:inline-block; background:var(--navy); color:#fff; text-decoration:none; padding:9px 18px; border-radius:22px; font-size:14px; font-weight:600; margin:8px 0; }
        .kaart-cta:hover { background:var(--gold); }
        .tekstverwijzingen { columns:2 220px; list-style:none; padding:0; }
        .tekstverwijzingen li { break-inside:avoid; border-bottom:1px solid #e8e2d5; padding:7px 0; font-size:14px; }
        .review { color:#777; font-size:11px; margin-left:5px; }
        .bron { background:rgba(203,164,73,.08); border-left:3px solid var(--gold); padding:14px 16px; font-size:14px; line-height:1.55; }
        .fout { color:#9c2c22; }
        :root[data-theme="donker"] body { background:var(--bg-page); color:var(--text-primary); }
        :root[data-theme="donker"] h1, :root[data-theme="donker"] h2 { color:var(--text-primary); }
        :root[data-theme="donker"] .intro, :root[data-theme="donker"] .gegeven dd { color:var(--text-secondary, #bbb); }
        :root[data-theme="donker"] .gegeven { background:var(--bg-surface); border-color:var(--border-default, #333); }
        :root[data-theme="donker"] .tekstverwijzingen li { border-color:var(--border-default, #333); }
    </style>
    <script>(function(){try{var s=localStorage.getItem('sv2026_vertaalopties');var t=s?(JSON.parse(s).thema||'auto'):'auto';if(t==='auto')t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'donker':'licht';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
    <nav id="topnav"></nav>
    <script src="js/topnav.js"></script>
    <main class="page" id="plaats-inhoud" aria-live="polite"><p>Gegevens laden…</p></main>
    <script src="js/book-orders.js"></script>
    <script>
    (function () {
        var inhoud = document.getElementById('plaats-inhoud');
        var boeknamen = {};
        var zekerheidLabel = { zeker: 'Zekere locatie', waarschijnlijk: 'Waarschijnlijke locatie', onzeker: 'Onzekere locatie' };
        function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
        function veiligeUrl(value) { try { var url = new URL(value); return url.protocol === 'https:' ? url.href : ''; } catch (e) { return ''; } }
        function mooieRef(ref) { return (boeknamen[ref.boek] || ref.boek) + ' ' + ref.hoofdstuk + ':' + ref.vers; }
        function detail(feature) {
            var p = feature.properties;
            var bron = p.bron || {};
            var bronUrl = veiligeUrl(bron.url);
            var coords = feature.geometry && feature.geometry.coordinates || [];
            document.title = (p.naam || 'Plaats') + ' — Open Vertaling';
            var velden = [
                ['Soort', esc(p.type)],
                ['Locatie', '<span class="badge z-' + esc(p.zekerheid || 'onzeker') + '">' + esc(zekerheidLabel[p.zekerheid] || p.zekerheid || 'onzeker') + '</span>'],
                ['Moderne aanduiding', p.moderneNaam ? esc(p.moderneNaam) : ''],
                ['Huidig gebied', p.landModern ? esc(p.landModern) : ''],
                ['Kaartpunt', coords.length === 2 ? Number(coords[1]).toFixed(5) + ', ' + Number(coords[0]).toFixed(5) : '—']
            ].filter(function (item) { return item[1]; });
            var refs = (p.refs || []).map(function (ref) {
                return '<li><a href="' + esc(ref.href) + '">' + esc(mooieRef(ref)) + '</a>' +
                    (ref.status === 'needs-human-review' ? '<span class="review">tekstkoppeling te controleren</span>' : '') + '</li>';
            }).join('');
            inhoud.innerHTML =
                '<p class="kruimel"><a href="geografie.html">Geografische aanduidingen</a> / ' + esc(p.naam) + '</p>' +
                '<h1>' + esc(p.naam) + '</h1>' +
                (p.toelichting ? '<p class="intro">' + esc(p.toelichting) + '</p>' : '<p class="intro">Geografische aanduiding met de vindplaatsen in de Bijbeltekst.</p>') +
                '<a class="kaart-cta" href="kaart.html?plaats=' + encodeURIComponent(p.id) + '">Bekijk deze plaats op de kaart →</a>' +
                '<dl class="gegevens">' + velden.map(function (item) { return '<div class="gegeven"><dt>' + esc(item[0]) + '</dt><dd>' + item[1] + '</dd></div>'; }).join('') + '</dl>' +
                '<h2>Alle tekstverwijzingen</h2><ul class="tekstverwijzingen">' + refs + '</ul>' +
                '<h2>Brongegevens</h2><div class="bron"><strong>' + esc(bron.dataset || 'Bron niet gespecificeerd') + '</strong>' +
                (bronUrl ? '<br><a href="' + esc(bronUrl) + '" target="_blank" rel="noopener noreferrer">Bron openen ↗</a>' : '') +
                (bron.ancientId ? '<br>Bron-id: ' + esc(bron.ancientId) : '') +
                (bron.modernId ? '<br>Identificatie: ' + esc(bron.modernId) : '') +
                (bron.onderbouwing ? '<br>' + esc(bron.onderbouwing) : '') + '</div>';
        }
        Promise.all([
            fetch('data/geografie-runtime.geojson').then(function (r) { if (!r.ok) throw new Error('kaartgegevens niet beschikbaar'); return r.json(); }),
            fetch('data/books.json').then(function (r) { return r.ok ? r.json() : { books: [] }; }).catch(function () { return { books: [] }; })
        ]).then(function (resultaten) {
            (resultaten[1].books || []).forEach(function (boek) { boeknamen[boek.id] = boek.nameDutch || boek.id; });
            var plaats = new URLSearchParams(window.location.search).get('plaats');
            var feature = plaats && resultaten[0].features.find(function (feature) { return feature.properties.id === plaats; });
            if (!feature) {
                inhoud.innerHTML = '<p class="fout">Deze plaats is niet gevonden.</p><p><a class="kaart-cta" href="geografie.html">Terug naar alle plaatsen</a></p>';
                return;
            }
            detail(feature);
        }).catch(function () { inhoud.innerHTML = '<p class="fout">De plaatsgegevens konden niet worden geladen.</p>'; });
    })();
    </script>
</body>
</html>
