    <style>
        body { display: block; background: #f8f6f2; }
        .page { max-width: 1000px; padding: 30px 24px 80px; font-family: var(--font-body); }
        .page h1 { font-family: var(--font-cursive); font-size: 36px; color: var(--navy); font-weight: 400; margin-bottom: 4px; }
        .page .subtitle { color: var(--teal); font-size: 14px; margin-bottom: 20px; }
        .page h2 { color: var(--navy); font-family: var(--font-cursive); font-size: 26px; font-weight: 400; margin: 32px 0 10px; border-bottom: 2px solid var(--gold); padding-bottom: 6px; }
        .page p, .page li { line-height: 1.7; margin-bottom: 6px; }
        .page a { color: var(--teal); text-decoration: none; }
        .page a:hover { color: var(--gold); text-decoration: underline; }
        .principle-box { background: rgba(146,182,180,0.12); border: 1px solid var(--border); border-left: 4px solid var(--gold); padding: 11px 15px; margin: 10px 0; border-radius: 0 4px 4px 0; }
        .dating-line { font-size: 13px; color: var(--teal); margin: 4px 0 16px; }

        .codex-card { background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 0 6px 6px 0; padding: 12px 16px; margin: 12px 0; overflow: hidden; }
        .codex-card.oudste { border-left-color: #16a34a; background: #f6fdf9; }
        .codex-badge { display: inline-block; font-size: 11px; font-weight: 600; color: #fff; background: #16a34a; border-radius: 10px; padding: 1px 9px; margin-bottom: 6px; font-family: 'Fira Sans', sans-serif; }
        .codex-photo { float: right; width: 175px; margin: 2px 0 8px 16px; text-align: center; }
        .codex-photo img { width: 175px; height: auto; display: block; border: 1px solid var(--border); border-radius: 4px; background: #f4f1e8; }
        .codex-photo figcaption { font-size: 10px; color: var(--teal); margin-top: 3px; line-height: 1.35; font-family: 'Fira Sans', sans-serif; }
        @media (max-width: 600px) { .codex-photo { float: none; width: 100%; margin: 0 0 10px; } .codex-photo img { width: 100%; } }
        .codex-card h4 { margin: 0 0 4px; color: var(--navy); font-family: 'Fira Sans', sans-serif; font-size: 16px; }
        .codex-card h4 .bijnaam { font-weight: 400; color: var(--teal); font-size: 13px; }
        .codex-card .meta { font-size: 12px; color: var(--teal); margin-bottom: 6px; font-family: 'Fira Sans', sans-serif; }
        .codex-card p { margin: 4px 0; font-size: 13px; line-height: 1.6; }
        .ms-facts { list-style: none; margin: 8px 0 2px; padding: 8px 10px; background: rgba(146,182,180,0.10); border-radius: 5px; font-size: 12.5px; line-height: 1.55; }
        .ms-facts li { margin: 2px 0; }
        .ms-facts li strong { color: var(--navy); font-family: 'Fira Sans', sans-serif; }
        .ms-facts .ms-bewijs a { color: var(--teal); }

        :root[data-theme="donker"] body { background: var(--bg-page); color: var(--text-primary); }
        :root[data-theme="donker"] .codex-card { background: var(--bg-surface) !important; border-color: var(--border-default) !important; color: var(--text-primary); }
        :root[data-theme="donker"] .codex-card.oudste { background: rgba(22,163,74,0.10) !important; }
        :root[data-theme="donker"] .codex-card h4 { color: var(--text-primary); }
        :root[data-theme="donker"] .codex-card .meta, :root[data-theme="donker"] .codex-card p { color: var(--text-secondary); }
        :root[data-theme="donker"] .ms-facts { background: rgba(255,255,255,0.05); }
        :root[data-theme="donker"] .ms-facts li strong { color: var(--text-primary); }
        :root[data-theme="donker"] h1, :root[data-theme="donker"] h2 { color: var(--text-primary); }
        :root[data-theme="donker"] p, :root[data-theme="donker"] li { color: var(--text-primary); }

        /* Samenvatting bovenaan: oudste fragment + oudste volledige versie */
        .ms-summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 18px; }
        .ms-summary .sum-card { flex: 1 1 240px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: #fff; }
        .ms-summary .sum-card.frag { border-left: 4px solid #16a34a; }
        .ms-summary .sum-card.vol { border-left: 4px solid var(--gold); }
        .ms-summary .sum-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--teal); font-family: 'Fira Sans', sans-serif; }
        .ms-summary .sum-name { font-size: 15px; font-weight: 600; color: var(--navy); font-family: 'Fira Sans', sans-serif; margin: 2px 0; }
        .ms-summary .sum-meta { font-size: 12px; color: #666; }
        .ms-summary .sum-card a { color: inherit; }
        :root[data-theme="donker"] .ms-summary .sum-card { background: var(--bg-surface); border-color: var(--border-default); }
        :root[data-theme="donker"] .ms-summary .sum-name { color: var(--text-primary); }

        /* Fragment-tekst: Grieks + Nederlands */
        .frag-verse { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--border); }
        .frag-num { font-weight: 700; color: var(--gold); font-family: 'Fira Sans', sans-serif; margin-right: 6px; }
        .frag-grc { font-size: 17px; line-height: 1.7; color: var(--navy); font-family: 'EB Garamond', serif; }
        .frag-nl { font-size: 14px; line-height: 1.6; color: #444; margin-top: 3px; }
        :root[data-theme="donker"] .frag-grc { color: #e8e2d0; }
        :root[data-theme="donker"] .frag-nl { color: var(--text-secondary); }

        /* Persoon-link + popup */
        .persoon-link { color: var(--teal); border-bottom: 1px dotted var(--teal); cursor: pointer; }
        .persoon-link:hover { color: var(--gold); }
        .persoon-popup { position: fixed; z-index: 200; max-width: 320px; background: var(--bg-surface, #fff); color: var(--text-primary, #222);
            border: 1px solid var(--border-default, #d8d2c6); border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); padding: 12px 14px; font-size: 13px; line-height: 1.55; }
        .persoon-popup h5 { margin: 0 0 2px; font-size: 14px; color: var(--navy); font-family: 'Fira Sans', sans-serif; }
        .persoon-popup .pp-jaren { font-size: 12px; color: var(--teal); margin-bottom: 6px; }
        .persoon-popup .pp-more { margin-top: 8px; font-size: 12px; }
        :root[data-theme="donker"] .persoon-popup h5 { color: var(--text-primary); }
    </style>

<script>(function(){var b=document.getElementById('topnav-theme-toggle');if(!b)return;b.addEventListener('click',function(){try{var s=JSON.parse(localStorage.getItem('sv2026_vertaalopties')||'{}');var cur=document.documentElement.dataset.theme==='donker'?'licht':'donker';s.thema=cur;localStorage.setItem('sv2026_vertaalopties',JSON.stringify(s));document.documentElement.setAttribute('data-theme',cur);}catch(e){console.error(e);}});})();</script>
<script>
(function () {
    function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
    function q(name) { var m = location.search.match(new RegExp('[?&]' + name + '=([^&]+)')); return m ? decodeURIComponent(m[1]) : null; }

    var PERSONEN = {};

    // Ontdekker als interne link (opent een beknopte bio-popup) i.p.v. een externe link.
    function personLink(ms) {
        var g = ms.gevonden || {};
        if (!g.wie) return null;
        if (ms.persoon && PERSONEN[ms.persoon]) {
            return '<a class="persoon-link" data-persoon="' + esc(ms.persoon) + '" role="button" tabindex="0">' + esc(g.wie) + '</a>';
        }
        return esc(g.wie);
    }

    function card(ms, isOudste) {
        var g = ms.gevonden || {};
        var wie = personLink(ms);
        var vind = wie ? ('door ' + wie + (g.jaar ? ' (' + esc(g.jaar) + ')' : '') + (g.plaats ? ', ' + esc(g.plaats) : ''))
                       : (g.hoe ? '' : (g.jaar ? esc(g.jaar) : '—'));
        var facts = '<ul class="ms-facts">';
        facts += '<li><strong>Bevindt zich:</strong> ' + esc(ms.bewaarplaats || '—') + '</li>';
        if (ms.bevat) facts += '<li><strong>Bevat:</strong> ' + esc(ms.bevat) + '</li>';
        facts += '<li><strong>Gevonden/verworven:</strong> ' + (vind ? vind + '. ' : '') + esc(g.hoe || '') + '</li>';
        if (ms.bewijs && ms.bewijs.url) facts += '<li class="ms-bewijs"><strong>Bewijs:</strong> <a href="' + esc(ms.bewijs.url) + '" target="_blank" rel="noopener">' + esc(ms.bewijs.tekst) + '</a></li>';
        facts += '</ul>';
        var fig = ms.afbeelding ? ('<figure class="codex-photo"><a href="' + esc(ms.commons) + '" target="_blank" rel="noopener">' +
            '<img src="' + esc(ms.afbeelding) + '" alt="' + esc(ms.bijschrift || ms.naam) + '" loading="lazy"></a>' +
            '<figcaption>' + esc(ms.bijschrift || '') + '<br><a href="' + esc(ms.commons) + '" target="_blank" rel="noopener">Wikimedia</a> (' + esc(ms.licentie || 'bron') + ')</figcaption></figure>') : '';
        return '<div class="codex-card' + (isOudste ? ' oudste' : '') + '">' + fig +
            (isOudste ? '<span class="codex-badge">Oudste bewaarde tekst</span><br>' : '') +
            '<h4>' + esc(ms.naam) + (ms.bijnaam ? ' <span class="bijnaam">' + esc(ms.bijnaam) + '</span>' : '') + '</h4>' +
            '<div class="meta">' + esc(ms.datering || '') + (ms.bewaarplaats ? ' · ' + esc(ms.bewaarplaats) : '') + '</div>' +
            '<p>' + esc(ms.beschrijving || '') + '</p>' + facts + '</div>';
    }

    function sumCard(label, ms, cls) {
        return '<div class="sum-card ' + cls + '"><div class="sum-label">' + esc(label) + '</div>' +
            '<div class="sum-name">' + esc(ms.naam) + (ms.bijnaam ? ' <span style="font-weight:400;color:var(--teal);font-size:12px;">' + esc(ms.bijnaam) + '</span>' : '') + '</div>' +
            '<div class="sum-meta">' + esc(ms.datering || '') + (ms.bevat ? ' · ' + esc(ms.bevat) : '') + '</div></div>';
    }

    // Beknopte bio-popup (intern) met één externe link.
    function closePopup() { var p = document.getElementById('persoon-popup'); if (p) p.remove(); document.removeEventListener('click', outside, true); }
    function outside(e) { var p = document.getElementById('persoon-popup'); if (p && !p.contains(e.target) && !(e.target.classList && e.target.classList.contains('persoon-link'))) closePopup(); }
    function showPopup(link) {
        closePopup();
        var pid = link.getAttribute('data-persoon'); var per = PERSONEN[pid]; if (!per) return;
        var pop = document.createElement('div');
        pop.id = 'persoon-popup'; pop.className = 'persoon-popup';
        pop.innerHTML = '<h5>' + esc(per.naam) + '</h5>' + (per.jaren ? '<div class="pp-jaren">' + esc(per.jaren) + '</div>' : '') +
            '<div>' + esc(per.bio) + '</div>' +
            (per.wikipedia ? '<div class="pp-more">Meer: <a href="' + esc(per.wikipedia) + '" target="_blank" rel="noopener">Wikipedia →</a></div>' : '');
        document.body.appendChild(pop);
        var r = link.getBoundingClientRect();
        var top = r.bottom + 6, left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 12);
        if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 6);
        pop.style.top = top + 'px'; pop.style.left = Math.max(8, left) + 'px';
        setTimeout(function () { document.addEventListener('click', outside, true); }, 0);
    }
    document.addEventListener('click', function (e) {
        var l = e.target.closest ? e.target.closest('.persoon-link') : null;
        if (l) { e.preventDefault(); e.stopPropagation(); showPopup(l); }
    });

    // Render de Griekse grondtekst + Nederlandse vertaling van een fragment.
    function renderFragmentText(ms) {
        var tf = ms.tekstfragment; if (!tf) return;
        var container = document.getElementById('fragment-tekst'); if (!container) return;
        var chs = {}; (tf.blokken || []).forEach(function (b) { chs[b.hoofdstuk] = true; });
        var jobs = Object.keys(chs).map(function (ch) {
            return fetch('data/' + tf.boek + '/' + ch + '.json').then(function (r) { return r.json(); }).then(function (d) { return { ch: ch, d: d }; });
        });
        Promise.all(jobs).then(function (loaded) {
            var byCh = {}; loaded.forEach(function (x) { byCh[x.ch] = x.d; });
            var h = '<h2>Tekst van dit fragment</h2>' +
                '<p style="font-size:13px;color:var(--teal);">De Griekse grondtekst en de Nederlandse vertaling van ' + esc(tf.verwijzing) + '.</p>';
            (tf.blokken || []).forEach(function (b) {
                var d = byCh[b.hoofdstuk]; if (!d) return;
                h += '<h3 style="color:var(--teal);font-size:15px;margin:16px 0 4px;">' + esc(b.label) + '</h3>';
                b.nummers.forEach(function (n) {
                    var v = (d.verses || []).find(function (x) { return x.number === n; }); if (!v) return;
                    var grc = (v.grondtekst || []).map(function (w) { return w.woord; }).join(' ');
                    h += '<div class="frag-verse"><span class="frag-num">' + n + '</span>' +
                        (grc ? '<span class="frag-grc" lang="grc">' + esc(grc) + '</span>' : '') +
                        '<div class="frag-nl">' + esc(v.text2026 || '') + '</div></div>';
                });
            });
            if (tf.verschillen) h += '<div class="principle-box" style="background:rgba(203,164,73,0.08);margin-top:14px;"><strong>Wat verschilt er van de tekst die wij kennen?</strong> ' + esc(tf.verschillen) + '</div>';
            container.innerHTML = h;
        }).catch(function (e) { console.error(e); });
    }

    Promise.all([
        fetch('data/manuscripts.json').then(function (r) { return r.json(); }),
        fetch('data/books.json').then(function (r) { return r.json(); }).catch(function () { return { books: [] }; }),
        fetch('data/book-dating.json').then(function (r) { return r.json(); }).catch(function () { return {}; })
    ]).then(function (res) {
        var data = res[0], books = res[1], dating = res[2];
        PERSONEN = data.personen || {};
        var el = document.getElementById('ms-page');
        var boekId = q('boek');
        var M = data.manuscripten || {}, B = data.boeken || {};
        var beschikbaar = Object.keys(B);

        var bkLookup = function (id) { return (books.books || []).find(function (b) { return b.id === id; }); };

        // Geen/onbekend boek → keuzepagina
        if (!boekId || !bkLookup(boekId)) {
            el.innerHTML = '<h1>Handschriften per bijbelboek</h1>' +
                '<p class="subtitle">Kies een boek</p>' +
                '<div class="principle-box">Uitgebreide handschrift-pagina beschikbaar voor: ' +
                (beschikbaar.length ? beschikbaar.map(function (id) {
                    var bk = bkLookup(id);
                    return '<a href="handschriften.html?boek=' + encodeURIComponent(id) + '">' + esc(bk ? bk.nameDutch : id) + '</a>';
                }).join(' · ') : 'nog geen') +
                '.</div><p>Zie ook het volledige <a href="grondteksten.html#codices">overzicht van codices</a> en de <a href="grondteksten.html">grondteksten per boek</a>.</p>';
            return;
        }

        // Boek bestaat maar heeft (nog) geen uitgebreide handschrift-data → minimale pagina
        if (!B[boekId]) {
            var bk0 = bkLookup(boekId), d0 = dating && dating[boekId];
            var h = '<h1>Handschriften van ' + esc(bk0.nameDutch) + '</h1>';
            if (d0) {
                var pp = [];
                if (d0.schrijftijd) pp.push('Vermoedelijke schrijftijd: ' + esc(d0.schrijftijd));
                if (d0.oudsteHandschrift) pp.push('Oudste handschrift: ' + esc(d0.oudsteHandschrift));
                if (pp.length) h += '<div class="dating-line">📜 ' + pp.join(' &nbsp;·&nbsp; ') + '</div>';
            }
            h += '<div class="principle-box">Voor dit boek is nog geen uitgebreide handschrift-pagina met foto’s gemaakt. ' +
                'De belangrijkste tekstgetuigen staan wel in de <a href="grondteksten.html?boek=' + encodeURIComponent(boekId) + '">grondtekst-tabel</a>, ' +
                'en de codices met foto’s in het <a href="grondteksten.html#codices">codex-overzicht</a>.</div>';
            h += '<p>→ Lees ' + esc(bk0.nameDutch) + ' in de tekst: <a href="index.html#' + encodeURIComponent(boekId) + '/1">' + esc(bk0.nameDutch) + ' 1</a></p>';
            el.innerHTML = h;
            document.title = 'Handschriften van ' + bk0.nameDutch + ' — Open Staten Vertaling';
            return;
        }

        var boek = B[boekId];
        var bk = (books.books || []).find(function (b) { return b.id === boekId; });
        var naam = bk ? bk.nameDutch : boekId;
        var d = dating && dating[boekId];

        var html = '<h1>Handschriften van ' + esc(naam) + '</h1>';
        html += '<p class="subtitle">het oudste fragment, de vindgeschiedenis en de originele scans</p>';
        if (d) {
            var parts = [];
            if (d.schrijftijd) parts.push('Vermoedelijke schrijftijd: ' + esc(d.schrijftijd));
            if (d.oudsteHandschrift) parts.push('Oudste handschrift: ' + esc(d.oudsteHandschrift));
            if (parts.length) html += '<div class="dating-line">📜 ' + parts.join(' &nbsp;·&nbsp; ') + '</div>';
        }
        var oudste = boek.oudsteFragment;
        var oudsteVol = boek.oudsteVolledig || (boek.volledig && boek.volledig[0]);
        var sum = '';
        if (oudste && M[oudste]) sum += sumCard('Oudste fragment', M[oudste], 'frag');
        if (oudsteVol && M[oudsteVol]) sum += sumCard('Oudste volledige versie', M[oudsteVol], 'vol');
        if (sum) html += '<div class="ms-summary">' + sum + '</div>';

        if (boek.intro) html += '<div class="principle-box">' + esc(boek.intro) + '</div>';

        if (oudste && M[oudste]) {
            html += '<h2>Oudste bewaarde tekst</h2>' + card(M[oudste], true) + '<div id="fragment-tekst"></div>';
        }
        var frags = (boek.fragmenten || []).filter(function (id) { return id !== oudste && M[id]; });
        if (frags.length) {
            html += '<h2>Andere vroege fragmenten</h2>';
            frags.forEach(function (id) { html += card(M[id], false); });
        }
        var vol = (boek.volledig || []).filter(function (id) { return M[id]; });
        if (vol.length) {
            html += '<h2>Volledige handschriften</h2>';
            vol.forEach(function (id) { html += card(M[id], false); });
        }
        if (boek.tekstgetuigen) html += '<p style="font-size:13px;color:var(--teal);"><strong>Tekstgetuigen totaal:</strong> ' + esc(boek.tekstgetuigen) + '</p>';

        html += '<h2>Bronvermelding</h2>' +
            '<p style="font-size:12.5px;color:var(--teal);">De foto’s van de handschriften komen van ' +
            '<a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> en behoren tot het publieke domein; klik op een foto voor de bronpagina en de hoge-resolutie scan. ' +
            'Datering en toeschrijving volgen de gangbare tekstkritische literatuur (o.a. Aland, Metzger). ' +
            'Zie ook het <a href="grondteksten.html#codices">codex-overzicht</a> en de <a href="grondteksten.html?boek=' + encodeURIComponent(boekId) + '">grondtekst-tabel</a>.</p>';
        html += '<p style="margin-top:14px;">→ Lees ' + esc(naam) + ' in de tekst: <a href="index.html#' + encodeURIComponent(boek.leesInReader || boekId) + '/1">' + esc(naam) + ' 1</a></p>';

        el.innerHTML = html;
        document.title = 'Handschriften van ' + naam + ' — Open Staten Vertaling';
        if (oudste && M[oudste]) renderFragmentText(M[oudste]);
    }).catch(function (e) {
        document.getElementById('ms-page').innerHTML = '<p style="color:#c0392b">Kon de handschrift-gegevens niet laden.</p>';
        console.error(e);
    });
})();
</script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/stats-inject.js"></script>
</body>
</html>
