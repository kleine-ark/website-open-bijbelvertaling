<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#142e42">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="description" content="De geslachtslijn van Adam tot Jozef en Jezus, generatie voor generatie: Seth, Noach, Sem, Abraham, Izak, Jakob, de twaalf stammen en het huis van David. Klik op een naam en lees de verzen waar hij vandaan komt.">

    <meta property="og:locale" content="nl_NL">
    <meta property="og:title" content="Stamboom van de Bijbel — Open Vertaling">
    <meta property="og:description" content="De geslachtslijn van Adam tot Jozef en Jezus, generatie voor generatie. Klik op een naam en lees de verzen waar hij vandaan komt.">
    <meta property="og:url" content="https://openvertaling.nl/stamboom.html">
    <meta property="og:image" content="https://openvertaling.nl/icons/icon-512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Stamboom van de Bijbel — Open Vertaling">
    <meta name="twitter:description" content="De geslachtslijn van Adam tot Jozef en Jezus, generatie voor generatie.">
    <meta name="twitter:image" content="https://openvertaling.nl/icons/icon-512.png">

    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    <style>
        /* body is een kolom-flexbox: zonder width:100% krimpen deze blokken met
           'margin: 0 auto' naar hun inhoudsbreedte in plaats van uit te rekken. */
        .sb-intro, .sb-bar, .sb-wrap { width: 100%; box-sizing: border-box; }
        .sb-intro { max-width: 900px; margin: 0 auto; padding: 22px 20px 4px; }
        .sb-intro h1 { margin: 0 0 2px; }
        .sb-intro .subtitle { margin: 0 0 10px; }
        /* ── Werkbalk ─────────────────────────────────────────────── */
        .sb-bar {
            max-width: 1400px; margin: 0 auto; padding: 0 14px 8px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        }
        .sb-bar button {
            font-family: var(--font-body); font-size: 12.5px; line-height: 1;
            padding: 7px 11px; border-radius: 6px; cursor: pointer;
            border: 1px solid var(--border-default, #d4d0c8);
            background: var(--bg-surface, #fff); color: var(--navy);
            -webkit-appearance: none; appearance: none;
        }
        .sb-bar button:hover { border-color: var(--gold); color: var(--gold); }
        :root[data-theme="donker"] .sb-bar button,
        :root[data-theme="donker"] .sb-zoek input,
        :root[data-theme="donker"] .sb-tref button {
            background: var(--bg-surface-alt); color: var(--text-primary);
            border-color: var(--border-default);
        }
        :root[data-theme="donker"] .sb-bar button:hover { color: var(--gold); }
        .sb-bar button.sb-icon { width: 32px; padding: 7px 0; font-size: 15px; font-weight: 600; }
        .sb-zoek { position: relative; flex: 1 1 190px; min-width: 150px; max-width: 300px; }
        .sb-zoek input {
            width: 100%; font-family: var(--font-body); font-size: 13px;
            padding: 7px 10px; border-radius: 6px; box-sizing: border-box;
            border: 1px solid var(--border-default, #d4d0c8);
            background: var(--bg-surface, #fff); color: var(--text-primary);
            -webkit-appearance: none; appearance: none;
        }
        .sb-zoek input:focus { outline: none; border-color: var(--gold); }
        .sb-tref {
            position: absolute; z-index: 40; top: 100%; left: 0; right: 0; margin-top: 3px;
            background: var(--bg-surface, #fff); border: 1px solid var(--border-default, #d4d0c8);
            border-radius: 6px; box-shadow: var(--shadow-soft, 0 2px 8px rgba(0,0,0,.12));
            max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .sb-tref button {
            display: block; width: 100%; text-align: left; border: none; border-radius: 0;
            background: none; padding: 7px 10px; font-size: 13px; color: var(--text-primary);
            border-bottom: 1px solid var(--border-soft, #eee);
        }
        .sb-tref button:last-child { border-bottom: none; }
        .sb-tref button:hover { background: rgba(203,164,73,0.12); color: var(--navy); }
        .sb-tref .sb-tref-bij { color: var(--text-muted, #888); font-size: 11.5px; }
        .sb-sprong { display: flex; flex-wrap: wrap; gap: 4px; }
        .sb-sprong button {
            font-size: 11.5px; padding: 5px 9px; border-radius: 20px;
            background: rgba(146,182,180,0.16); border-color: transparent; color: #47665e;
        }

        /* ── Tekenvlak ────────────────────────────────────────────── */
        .sb-wrap {
            position: relative; max-width: 1400px; margin: 0 auto 26px;
            padding: 0 14px; box-sizing: border-box;
        }
        .sb-canvas {
            position: relative; overflow: hidden;
            height: 70vh; min-height: 400px;
            border: 1px solid var(--border-default, #d4d0c8); border-radius: 8px;
            background:
                radial-gradient(circle at 1px 1px, rgba(20,46,66,0.10) 1px, transparent 0) 0 0/22px 22px,
                var(--bg-surface, #fff);
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            /* Een naam oppakken gaat op de telefoon met lang indrukken; zonder
               dit zet Safari daar zijn eigen vergrootglas/menu overheen. */
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            cursor: grab;
        }
        .sb-canvas.sb-sleept { cursor: grabbing; }
        :root[data-theme="donker"] .sb-canvas {
            background:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 0) 0 0/22px 22px,
                var(--bg-surface-alt, #121212);
        }
        .sb-canvas svg { display: block; width: 100%; height: 100%; }

        /* Vakjes. De maten staan in js/stamboom.js — hier alleen kleur en letter.
           Opzet als een gedrukt familieregister: serif-namen, hairline-randen,
           geen felle vlakken. Alleen de hoofdlijn draagt goud. */
        .sb-doos {
            fill: var(--bg-surface, #fff); stroke: var(--border-soft, #e8e4dc);
            stroke-width: 1;
        }
        .sb-node text { font-family: var(--font-serif); fill: var(--navy, #142e42); }
        .sb-naam { font-size: 15px; }
        .sb-bij { font-size: 12.5px; font-style: italic; fill: var(--text-muted, #888); }
        .sb-node { cursor: pointer; }
        .sb-node:hover .sb-doos { stroke: var(--gold); }
        .sb-node.is-vrouw .sb-doos { fill: rgba(203,164,73,0.08); }
        .sb-node.is-volk .sb-doos { stroke-dasharray: 2 3; }
        .sb-node.is-volk .sb-naam { fill: var(--text-muted, #888); font-style: italic; }
        .sb-node.is-lijn .sb-doos { stroke: rgba(203,164,73,0.85); }
        .sb-node.is-anker .sb-doos { stroke: var(--gold); stroke-width: 1.3; }
        .sb-node.is-anker .sb-naam { font-weight: 600; letter-spacing: .015em; }
        .sb-node.is-keten .sb-doos {
            fill: rgba(146,182,180,0.09); stroke: rgba(146,182,180,0.85);
            stroke-width: 1; stroke-dasharray: 4 3;
        }
        .sb-node.is-keten .sb-naam { fill: var(--text-secondary, #555); font-style: italic; }
        .sb-node.is-gekozen .sb-doos { fill: var(--navy); stroke: var(--gold); stroke-width: 1.4; }
        .sb-node.is-gekozen .sb-naam { fill: #fdfbf6; }
        .sb-node.is-gekozen .sb-bij { fill: rgba(255,255,255,0.70); }
        /* Terwijl een naam met de hand verplaatst wordt. */
        .sb-node.is-pakt { cursor: grabbing; }
        .sb-node.is-pakt .sb-doos { stroke: var(--gold); stroke-width: 1.6; }
        :root[data-theme="donker"] .sb-node text { fill: var(--text-primary, #e8e6e0); }
        :root[data-theme="donker"] .sb-node.is-keten .sb-naam { fill: var(--teal-light, #a5c4b8); }
        :root[data-theme="donker"] .sb-node.is-gekozen .sb-doos { fill: #2b3a46; }

        /* Dunne, rustige verbindingslijnen — de rail links met een streepje
           naar elk kind, zoals in een gedrukte geslachtslijst. */
        .sb-lijn { fill: none; stroke: var(--border-default, #d4d0c8); stroke-width: 1; }
        /* De rail loopt langs een hele zijtak en kan duizenden pixels lang zijn;
           lichter dan de streepjes naar de kinderen, anders overheerst hij. */
        .sb-lijn.is-rail { stroke: var(--border-soft, #e8e4dc); }
        .sb-lijn.is-lijn { stroke: rgba(203,164,73,0.9); stroke-width: 1.2; }
        .sb-lijn.is-via { stroke-dasharray: 4 3; }

        /* Telbadge: "+12" opent de zijtakken, "8 gen." vouwt een keten uit. */
        .sb-badge { cursor: pointer; }
        .sb-badge rect { fill: none; stroke: rgba(203,164,73,0.55); stroke-width: 1; }
        .sb-badge text { font-size: 9.5px; font-weight: 600; fill: #8a6d1f; font-family: var(--font-body); }
        .sb-badge.is-keten rect { stroke: rgba(146,182,180,0.75); }
        .sb-badge.is-keten text { fill: #3f6058; }
        .sb-badge:hover rect { fill: var(--gold); stroke: var(--gold); }
        .sb-badge:hover text { fill: #fff; }
        :root[data-theme="donker"] .sb-badge text { fill: var(--gold); }
        :root[data-theme="donker"] .sb-badge.is-keten text { fill: var(--teal-light, #a5c4b8); }
        :root[data-theme="donker"] .sb-badge:hover text { fill: #1a1d24; }

        .sb-hint {
            position: absolute; left: 24px; bottom: 14px; z-index: 5; pointer-events: none;
            font-size: 12px; color: var(--text-muted, #888);
            background: var(--bg-surface, #fff); border: 1px solid var(--border-soft, #e8e4dc);
            border-radius: 20px; padding: 5px 12px; opacity: .95;
        }
        .sb-hint.weg { display: none; }
        .sb-laden {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: var(--text-muted, #888);
        }

        /* ── Persoonskaart ────────────────────────────────────────── */
        .sb-kaart {
            position: absolute; z-index: 20; top: 10px; right: 24px; width: 340px;
            max-height: calc(100% - 20px); overflow-y: auto; -webkit-overflow-scrolling: touch;
            background: var(--bg-surface, #fff);
            border: 1px solid var(--border-default, #d4d0c8); border-radius: 8px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.14);
            padding: 14px 16px 16px;
        }
        .sb-kaart[hidden] { display: none; }
        .sb-kaart h2 {
            font-family: var(--font-cursive); font-weight: 400; font-size: 30px;
            color: var(--navy); margin: 0 0 2px; line-height: 1.1;
            padding-right: 26px; border: none;
        }
        :root[data-theme="donker"] .sb-kaart h2 { color: var(--gold); }
        .sb-kaart h3 {
            font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--gold); margin: 14px 0 5px; border: none; font-weight: 600;
        }
        .sb-sluit {
            position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
            border: none; background: none; cursor: pointer; border-radius: 50%;
            font-size: 17px; line-height: 1; color: var(--text-muted, #888);
        }
        .sb-sluit:hover { background: var(--bg-surface-alt, #f5f2ed); color: var(--navy); }
        .sb-kaart .sb-gen { font-size: 11.5px; color: var(--text-muted, #888); margin: 0 0 8px; }
        .sb-kaart .sb-opm {
            font-size: 13px; color: var(--text-secondary, #555); margin: 0 0 8px;
            border-left: 3px solid var(--teal, #92b6b4); padding: 5px 10px;
            background: rgba(146,182,180,0.10); border-radius: 0 5px 5px 0;
        }
        .sb-rel { font-size: 13px; color: var(--text-secondary, #555); margin: 4px 0; }
        .sb-rel b { color: var(--text-muted, #888); font-weight: 600; font-size: 11.5px;
                    text-transform: uppercase; letter-spacing: .04em; }
        .sb-ga {
            background: none; border: none; padding: 0; cursor: pointer; font: inherit;
            color: var(--teal, #76978a); text-decoration: underline; text-underline-offset: 2px;
        }
        .sb-ga:hover { color: var(--gold); }
        :root[data-theme="donker"] .sb-ga { color: var(--teal-light, #a5c4b8); }
        .sb-vers { margin: 0 0 10px; }
        .sb-vers a.sb-ref {
            font-size: 11.5px; font-weight: 600; color: var(--gold); text-decoration: none;
            letter-spacing: .02em;
        }
        .sb-vers a.sb-ref:hover { text-decoration: underline; }
        .sb-vers p {
            margin: 2px 0 0; font-family: var(--font-serif); font-size: 14px; line-height: 1.5;
            color: var(--text-primary, #333);
        }
        @media (max-width: 760px) {
            .sb-intro { padding: 14px 14px 2px; }
            /* Hoog genoeg om de volledig ingeklapte boom (18 regels) op een
               telefoon van 390 × 844 in één keer te tonen. */
            .sb-canvas { height: 74vh; min-height: 380px; }
            .sb-sprong {
                width: 100%; flex-wrap: nowrap; overflow-x: auto;
                -webkit-overflow-scrolling: touch; padding-bottom: 2px;
            }
            .sb-sprong button { flex: 0 0 auto; }
            .sb-hint { left: 12px; right: 12px; bottom: 10px; text-align: center; font-size: 11.5px; }
            .sb-kaart {
                top: auto; left: 14px; right: 14px; bottom: 0; width: auto;
                max-height: 62%; border-radius: 10px 10px 0 0;
            }
        }
    </style>
    <script>(function(){try{var s=localStorage.getItem("sv2026_vertaalopties");var t=s?(JSON.parse(s).thema||"auto"):"auto";if(t==="auto"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"donker":"licht";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
    <nav id="topnav"></nav>
    <script src="js/topnav.js?v=0.44.2"></script>

    <div class="sb-intro">
        <h1>Stamboom van de Bijbel</h1>
        <p class="subtitle">Van Adam, door de geslachten heen, tot Jozef en Jezus.</p>
    </div>

    <div class="sb-bar">
        <div class="sb-zoek">
            <input type="search" id="sb-zoek" placeholder="Zoek een naam…" autocomplete="off"
                   aria-label="Zoek een persoon in de stamboom">
            <div class="sb-tref" id="sb-tref" hidden></div>
        </div>
        <button type="button" id="sb-hoofdlijn" title="Alles dicht: alleen de lijn van Adam tot Jezus">Inklappen</button>
        <button type="button" id="sb-alles">Alles open</button>
        <button type="button" id="sb-passend">Passend</button>
        <button type="button" id="sb-herschik" hidden
                title="Zet met de hand verplaatste namen terug op hun plek">Indeling herstellen</button>
        <button type="button" class="sb-icon" id="sb-uit" aria-label="Uitzoomen">−</button>
        <button type="button" class="sb-icon" id="sb-in" aria-label="Inzoomen">+</button>
        <span class="sb-sprong" id="sb-sprong"></span>
    </div>

    <div class="sb-wrap">
        <div class="sb-canvas" id="sb-canvas">
            <div class="sb-laden" id="sb-laden">Stamboom wordt geladen…</div>
            <div class="sb-hint" id="sb-hint">Tik op <b>+12</b> voor de zijtakken, op een gestreept vakje voor de generaties ertussen</div>
        </div>
        <aside class="sb-kaart" id="sb-kaart" hidden aria-live="polite"></aside>
    </div>

    <script src="js/stamboom.js?v=0.44.2"></script>
</body>
</html>
