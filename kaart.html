    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; background: var(--bg-page, #f8f6f2); overflow: hidden; }
        .ol-popup { position: absolute; background: #fff; box-shadow: 0 2px 12px rgba(20,46,66,.25); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border, #d4d0c8); min-width: 210px; max-width: 280px; bottom: 14px; left: -120px; font-family: var(--font-body); }
        #popup-content { max-height: 420px; overflow: auto; overscroll-behavior: contain; padding-right: 5px; }
        .ol-popup:after { content: ""; position: absolute; bottom: -10px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top-color: #fff; }
        .ol-popup h3 { margin: 0 0 2px; font-size: 16px; color: var(--navy); font-family: var(--font-serif); }
        .ol-popup .pp-type { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--gold); font-weight: 600; }
        .ol-popup .pp-modern { font-size: 12.5px; color: #666; margin: 5px 0; }
        .ol-popup .pp-toel { font-size: 13px; color: #333; line-height: 1.45; margin: 6px 0; }
        .ol-popup .pp-toel a { display: inline-block; }
        .ol-popup .pp-refs { display: flex; flex-wrap: wrap; gap: 3px 8px; max-height: 180px; overflow: auto; font-size: 12.5px; margin-top: 6px; padding-right: 4px; }
        .ol-popup .pp-refs a { color: var(--gold); text-decoration: none; }
        .ol-popup .pp-refs a.ref-te-controleren { text-decoration: underline dotted; text-underline-offset: 3px; }
        .ol-popup .pp-koppeling { margin-top: 5px; color: #777; font-size: 10.5px; }
        .ol-popup .pp-zeker { display: inline-block; margin-top: 6px; font-size: 11px; padding: 1px 7px; border-radius: 10px; }
        .ol-popup-closer { position: absolute; top: 6px; right: 9px; text-decoration: none; color: #999; font-size: 15px; }
        .z-zeker { background: rgba(92,184,92,.18); color: #3d7a3d; }
        .z-waarschijnlijk { background: rgba(203,164,73,.20); color: #8a6d1f; }
        .z-onzeker { background: rgba(150,150,150,.20); color: #666; }
        :root[data-theme="donker"] body { background: var(--bg-page); }
        :root[data-theme="donker"] .ol-popup { background: var(--bg-surface); border-color: var(--border-default, #333); color: var(--text-primary); }

        :root[data-theme="donker"] .ol-popup .pp-toel { color: var(--text-secondary, #bbb); }

    <header class="kaart-kop">
        <div class="kaart-koptekst">
            <div class="kaart-titelrij">

            <p>Klik op een plaats voor de Bijbelse verwijzingen. <a href="geografie.html">Bekijk alle plaatsen</a></p>
        </div>

                <input id="kaart-zoekveld" type="search" placeholder="Plaatsen laden…" disabled
                       role="combobox" aria-autocomplete="list" aria-expanded="false"

            </div>
            <div class="kaart-zoek-paneel" id="kaart-zoek-paneel" hidden>

                    <label><input type="checkbox" id="f-waarschijnlijk" checked><span class="zekerheidstip z-waarschijnlijk"></span><span>Waarschijnlijk</span></label>
                    <label><input type="checkbox" id="f-onzeker" checked><span class="zekerheidstip z-onzeker"></span><span>Onzeker</span></label>
                </div>

            <fieldset class="kaart-keuzegroep kaart-achtergronden">

                <div class="kaart-laagrooster">
                    <label class="kaart-laagoptie kaart-laag-kaart"><input type="radio" name="kaartlaag" value="kaart"><span class="kaart-laagvoorbeeld" aria-hidden="true"></span><span>Kaart</span></label>
                    <label class="kaart-laagoptie kaart-laag-stil"><input type="radio" name="kaartlaag" value="stil"><span class="kaart-laagvoorbeeld" aria-hidden="true"></span><span>Zonder tekst</span></label>
                    <label class="kaart-laagoptie kaart-laag-lucht"><input type="radio" name="kaartlaag" value="lucht" checked><span class="kaart-laagvoorbeeld" aria-hidden="true"></span><span>Luchtfoto</span></label>
                    <label class="kaart-laagoptie kaart-laag-land"><input type="radio" name="kaartlaag" value="land"><span class="kaart-laagvoorbeeld" aria-hidden="true"></span><span>Landschap</span></label>
                </div>
            </fieldset>
        </section>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>

    <script src="js/kaart-locaties.js?v=e9224c97896a"></script>
    <script>
    (function () {
        var BOOKNAMES = {};
        function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
        function prettyRef(ref) { var sp = ref.lastIndexOf(' '); var b = ref.slice(0, sp); return (BOOKNAMES[b] || (b.charAt(0).toUpperCase() + b.slice(1))) + ' ' + ref.slice(sp + 1); }
        function refHref(ref) { var sp = ref.lastIndexOf(' '); var b = ref.slice(0, sp); var cv = ref.slice(sp + 1).split(':'); return 'index.html#' + b + '/' + cv[0] + '/' + (cv[1] || ''); }

        var KLEUR = { stad: '#c0392b', dorp: '#c0392b', 'stad-dorp': '#c0392b', land: '#8e44ad', streek: '#8e44ad', regio: '#8e44ad', 'land-streek': '#8e44ad', berg: '#6b4b2a', rivier: '#2980b9', zee: '#2980b9', meer: '#2980b9', 'rivier-water': '#2980b9', eiland: '#16a085', woestijn: '#b7863c', 'dal-vlakte': '#66845d' };
        var geselecteerdePlaats = null;
        var stijlCache = new WeakMap();
        function plaatsStijlen(feat) {
            var p = feat.getProperties();
            var zoom = map ? map.getView().getZoom() : 5;
            var niveau = KaartLocaties.scale(zoom).id;
            var sel = feat === geselecteerdePlaats;
            var sleutel = niveau + ':' + sel;
            var cached = stijlCache.get(feat);
            if (cached && cached.sleutel === sleutel) return cached;
            var weergave = KaartLocaties.presentation(feat, zoom, filters(), sel);
            if (!weergave.visible) return {};
            var kleur = KLEUR[p.type] || '#555';
            var zeker = p.zekerheid === 'zeker', waarschijnlijk = p.zekerheid === 'waarschijnlijk';
            var stil = (niveau === 'overzicht' || niveau === 'regio') && !weergave.major && !sel;
            var punt = new ol.style.Style({
                zIndex: sel ? 10 : weergave.major ? 2 : 1,
                image: new ol.style.Circle({
                    radius: weergave.radius,
                    fill: new ol.style.Fill({ color: sel ? '#c9a44b' : stil ? 'rgba(255,253,248,.48)' : kleur }),
                    stroke: new ol.style.Stroke({ color: sel ? '#142e42' : stil ? 'rgba(20,46,66,.48)' : zeker ? '#fff' : waarschijnlijk ? '#c9a44b' : '#92999e', width: stil ? .65 : sel ? 2.5 : 1.5, lineDash: zeker || stil || sel ? undefined : [2, 2] })
                })
            });
            var label = weergave.label ? new ol.style.Style({
                text: new ol.style.Text({
                    text: p.naam, font: (sel || weergave.major ? '600 ' : '') + (sel ? '14px' : weergave.major ? '13px' : '12px') + ' "Fira Sans", sans-serif', offsetY: -weergave.radius - 11,
                    fill: new ol.style.Fill({ color: '#142e42' }),
                    stroke: new ol.style.Stroke({ color: 'rgba(255,253,248,.96)', width: 4 }),
                    padding: [3, 5, 3, 5], overflow: true
                })
            }) : undefined;
            cached = { sleutel: sleutel, punt: punt, label: label };
            stijlCache.set(feat, cached);
            return cached;
        }

        var vectorSource = new ol.source.Vector();
        // Punten worden nooit door labelbotsingen verborgen en blijven aanklikbaar.
        var vectorLayer = new ol.layer.Vector({ source: vectorSource, style: function (f) { return plaatsStijlen(f).punt; } });
        var labelLayer = new ol.layer.Vector({
            source: vectorSource, declutter: true,
            renderOrder: function (a, b) { return KaartLocaties.compareFeatures(a, b, filters(), geselecteerdePlaats && geselecteerdePlaats.get('id')); },
            style: function (f) { return plaatsStijlen(f).label; }
        });
        // OSM-achtergrond in grijswaarden (alleen de tegels, niet de markers)
        var osmLayer = new ol.layer.Tile({ source: new ol.source.OSM() });
        osmLayer.on('prerender', function (evt) {
            if (evt.context) { evt.context.filter = 'grayscale(1)'; }
        });
        osmLayer.on('postrender', function (evt) {
            if (evt.context) { evt.context.filter = 'none'; }
        });
        /* Extra achtergronden. Alle drie zonder eigen opmaaklaag:
           - stil:  CARTO light_nolabels — dezelfde OSM-data maar zonder namen,
                    zodat de Bijbelse namen niet vechten met de moderne
           - lucht: Esri World Imagery (satelliet)
           - land:  Esri Shaded Relief — alleen het landschap, geen wegen of
                    plaatsen; boven zoom 13 zijn er geen tegels, dus begrensd */
        function xyz(url, attributie, maxZoom) {
            return new ol.layer.Tile({
                visible: false,
                source: new ol.source.XYZ({ url: url, attributions: attributie,
                                            maxZoom: maxZoom || 19, crossOrigin: 'anonymous' })
            });
        }
        var lagen = {
            kaart: osmLayer,
            stil:  xyz('https://{a-d}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png',
                       '&copy; OpenStreetMap-bijdragers &copy; CARTO'),
            lucht: xyz('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                       'Bron: Esri, Maxar, Earthstar Geographics'),
            land:  xyz('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',
                       'Bron: Esri, USGS', 13)
        };
        document.querySelectorAll('input[name="kaartlaag"]').forEach(function (r) {
            r.addEventListener('change', function () {
                for (var k in lagen) lagen[k].setVisible(k === this.value);
            }.bind(r));
        });
        var standaardLaag = document.querySelector('input[name="kaartlaag"]:checked');
        if (standaardLaag) {
            for (var laagNaam in lagen) lagen[laagNaam].setVisible(laagNaam === standaardLaag.value);
        }

        var map = new ol.Map({
            target: 'map',
            layers: [ lagen.kaart, lagen.stil, lagen.lucht, lagen.land, vectorLayer, labelLayer ],
            view: new ol.View({ center: ol.proj.fromLonLat([32, 33]), zoom: 5 })
        });

        var overlay = new ol.Overlay({ element: document.getElementById('popup'), autoPan: { animation: { duration: 200 } } });
        map.addOverlay(overlay);
        document.getElementById('popup-closer').onclick = function () { sluitPlaats(); return false; };

        var boekSelect = document.getElementById('f-boek');
        var hoofdstukSelect = document.getElementById('f-hoofdstuk');
        var selectieVolgnummer = 0;
        function filters() {
            return {
                zeker: document.getElementById('f-zeker').checked,
                waarschijnlijk: document.getElementById('f-waarschijnlijk').checked,
                onzeker: document.getElementById('f-onzeker').checked,
                boek: boekSelect.value,
                hoofdstuk: hoofdstukSelect.value ? Number(hoofdstukSelect.value) : null
            };
        }
        function passendeRefs(feat, f) {
            return KaartLocaties.matchingRefs(feat, f);
        }
        function plaatsZichtbaar(feat, f) {
            return KaartLocaties.matchesFilter(feat, f);
        }
        function verversPlaatsen() {
            stijlCache = new WeakMap();
            vectorLayer.changed();
            labelLayer.changed();
        }
        function sluitPlaats() {
            selectieVolgnummer++;
            geselecteerdePlaats = null;
            overlay.setPosition(undefined);
            document.getElementById('popup').style.display = 'none';
            verversPlaatsen();
        }
        function animatieDuur() {
            return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 350;
        }
        function begrensPopup() {
            var maat = map.getSize();
            if (maat) document.getElementById('popup-content').style.maxHeight = Math.max(0, Math.min(420, maat[1] - 84)) + 'px';
        }
        map.on('change:size', function () {
            begrensPopup();
            if (geselecteerdePlaats && document.getElementById('popup').style.display !== 'none') overlay.panIntoView({ margin: 20, animation: { duration: animatieDuur() } });
        });
        function pasBeeldAan() {
            var f = filters();
            var punten = vectorSource.getFeatures().filter(function (feat) { return plaatsZichtbaar(feat, f); }).map(function (feat) { return feat.getGeometry().getCoordinates(); });
            if (punten.length) map.getView().fit(ol.extent.boundingExtent(punten), { padding: [50, 45, 65, 45], maxZoom: f.boek ? 10 : 7, duration: animatieDuur() });
        }
        function toonSchaal() {
            var schaal = KaartLocaties.scale(map.getView().getZoom());
            document.getElementById('kaart-schaal').textContent = schaal.label;
            document.getElementById('kaart-schaal-hint').textContent = schaal.hint;
        }
        map.getView().on('change:resolution', toonSchaal);
        toonSchaal();
        function schrijfFilterUrl(f) {
            var url = new URL(window.location.href);
            if (f.boek) url.searchParams.set('boek', f.boek); else url.searchParams.delete('boek');
            if (f.boek && f.hoofdstuk) url.searchParams.set('hoofdstuk', String(f.hoofdstuk)); else url.searchParams.delete('hoofdstuk');
            history.replaceState(null, '', url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '') + url.hash);
        }
        function pasFilterToe() {
            var f = filters(), zicht = 0;
            sluitPlaats();
            vectorSource.forEachFeature(function (feat) {
                var aan = plaatsZichtbaar(feat, f);
                feat.setStyle(aan ? undefined : new ol.style.Style({}));
                if (aan) zicht++;
            });
            document.getElementById('telling').textContent = zicht + ' plaatsen';
            schrijfFilterUrl(f);
            if (zoekGereed && (document.activeElement === zoekveld || !zoekPaneel.hidden)) werkZoekBij();
        }
        ['f-zeker', 'f-waarschijnlijk', 'f-onzeker'].forEach(function (id) { document.getElementById(id).addEventListener('change', pasFilterToe); });

        var verificationSourceHash;
        function selecteerPlaats(feat, inzoomen) {
            if (!feat || !plaatsZichtbaar(feat, filters())) return;
            var selectie = ++selectieVolgnummer;
            geselecteerdePlaats = feat;
            overlay.setPosition(undefined);
            document.getElementById('popup').style.display = 'none';
            verversPlaatsen();
            var p = feat.getProperties();
            var f = filters();
            var actieveRefs = passendeRefs(feat, f);
            var refs = actieveRefs.map(function (r) { return '<a' + (r.status === 'needs-human-review' ? ' class="ref-te-controleren" title="Tekstkoppeling moet nog menselijk worden gecontroleerd"' : '') + ' href="' + esc(r.href || refHref(r.ref)) + '">' + esc(prettyRef(r.ref)) + '</a>'; }).join(' ');
            var zl = { zeker: 'Locatie zeker', waarschijnlijk: 'Locatie waarschijnlijk', onzeker: 'Locatie onzeker' }[p.zekerheid] || '';
            document.getElementById('popup-content').innerHTML =
                '<div class="pp-type">' + esc(p.type || '') + '</div>' +
                '<h3>' + esc(p.naam || '') + '</h3>' +
                (p.moderneNaam ? '<div class="pp-modern">Nu: ' + esc(p.moderneNaam) + '</div>' : '') +
                (p.toelichting ? '<div class="pp-toel">' + esc(p.toelichting) + '</div>' : '') +
                '<div class="pp-toel"><a href="plaats.html?plaats=' + encodeURIComponent(p.id || '') + '">Bronpagina en alle verwijzingen →</a></div>' +
                (refs ? '<div class="pp-refs">' + refs + '</div>' : '') +
                (actieveRefs.some(function (r) { return r.status === 'needs-human-review'; }) ? '<div class="pp-koppeling">Gestippeld: tekstkoppeling nog menselijk te controleren</div>' : '') +
                (zl ? '<span class="pp-zeker z-' + esc(p.zekerheid) + '">' + zl + '</span>' : '');
            function toonPopup(voltooid) {
                if (voltooid === false || selectie !== selectieVolgnummer || geselecteerdePlaats !== feat || !plaatsZichtbaar(feat, filters())) return;
                begrensPopup();
                document.getElementById('popup-content').scrollTop = 0;
                document.getElementById('popup').style.display = '';
                Verification.mount(document.getElementById('popup-content'), 'location', p.id, {
                    sourceHash: verificationSourceHash
                });
                overlay.setPosition(feat.getGeometry().getCoordinates());
            }
            // Eerst het eindbeeld bereiken; de popup mag daarna ruimte laten maken.
            if (inzoomen) map.getView().animate({ center: feat.getGeometry().getCoordinates(), zoom: Math.max(12, map.getView().getZoom()), duration: animatieDuur() }, toonPopup);
            else toonPopup(true);
        }
        map.on('singleclick', function (evt) {
            var feat = map.forEachFeatureAtPixel(evt.pixel, function (f) { return f; }, { hitTolerance: 6, layerFilter: function (layer) { return layer === vectorLayer; } });
            sluitZoek();
            if (!feat) { sluitPlaats(); return; }
            selecteerPlaats(feat, false);
        });
        map.on('pointermove', function (e) { map.getTargetElement().style.cursor = map.hasFeatureAtPixel(e.pixel, { hitTolerance: 6, layerFilter: function (layer) { return layer === vectorLayer; } }) ? 'pointer' : ''; });

        var zoek = document.getElementById('kaart-zoek');
        var zoekveld = document.getElementById('kaart-zoekveld');
        var zoekWis = document.getElementById('kaart-zoek-wis');
        var zoekLijst = document.getElementById('kaart-zoek-resultaten');
        var zoekStatus = document.getElementById('kaart-zoek-status');
        var zoekPaneel = document.getElementById('kaart-zoek-paneel');
        var zoekAlles = document.getElementById('kaart-zoek-alles');
        var zoekGereed = false, zoekResultaten = [], zoekActief = -1;

        function sluitZoek() {
            zoekPaneel.hidden = true;
            zoekveld.setAttribute('aria-expanded', 'false');
            zoekveld.removeAttribute('aria-activedescendant');
            zoekActief = -1;
        }
        function activeerResultaat(index) {
            zoekActief = index;
            zoekLijst.querySelectorAll('[role="option"]').forEach(function (optie, i) {
                optie.setAttribute('aria-selected', String(i === index));
                if (i === index) { zoekveld.setAttribute('aria-activedescendant', optie.id); optie.scrollIntoView({ block: 'nearest' }); }
            });
        }
        function kiesZoekresultaat(index) {
            var resultaat = zoekResultaten[index];
            if (!resultaat || !plaatsZichtbaar(resultaat.feature, filters())) return;
            zoekveld.value = resultaat.label;
            zoekWis.hidden = false;
            sluitZoek();
            selecteerPlaats(resultaat.feature, true);
        }
        function werkZoekBij() {
            zoekWis.hidden = !zoekveld.value;
            zoekLijst.replaceChildren();
            zoekveld.removeAttribute('aria-activedescendant');
            zoekActief = -1;
            zoekResultaten = [];
            zoekAlles.hidden = true;
            if (!zoekGereed || !KaartLocaties.normalize(zoekveld.value)) { sluitZoek(); return; }
            var resultaat = KaartLocaties.search(vectorSource.getFeatures(), zoekveld.value, filters());
            zoekResultaten = resultaat.matches;
            zoekResultaten.forEach(function (match, index) {
                var optie = document.createElement('div');
                optie.id = 'kaart-zoek-optie-' + index;
                optie.className = 'kaart-zoek-optie';
                optie.setAttribute('role', 'option');
                optie.setAttribute('aria-selected', 'false');
                var naam = document.createElement('strong'); naam.textContent = match.label;
                var detail = document.createElement('span'); detail.textContent = match.detail;
                optie.appendChild(naam); optie.appendChild(detail);
                optie.addEventListener('mousedown', function (event) { event.preventDefault(); });
                optie.addEventListener('click', function () { kiesZoekresultaat(index); });
                zoekLijst.appendChild(optie);
            });
            zoekStatus.textContent = resultaat.total ? (resultaat.total > zoekResultaten.length ? zoekResultaten.length + ' van ' + resultaat.total + ' plaatsen. Verfijn je zoekopdracht.' : resultaat.total + (resultaat.total === 1 ? ' plaats gevonden.' : ' plaatsen gevonden.')) : 'Geen plaatsen gevonden binnen de actieve filters.';
            if (resultaat.outsideCount) {
                zoekStatus.textContent += ' ' + resultaat.outsideCount + (resultaat.outsideCount === 1 ? ' plaats valt' : ' plaatsen vallen') + ' buiten de filters.';
                zoekAlles.hidden = false;
            } else if (!resultaat.total) zoekStatus.textContent += ' Probeer een andere naam of schrijfwijze.';
            zoekPaneel.hidden = false;
            zoekveld.setAttribute('aria-expanded', 'true');
        }
        zoekveld.addEventListener('input', werkZoekBij);
        zoekveld.addEventListener('focus', werkZoekBij);
        zoekveld.addEventListener('keydown', function (event) {
            if (event.isComposing) return;
            if (event.key === 'Escape' && !zoekPaneel.hidden) {
                event.preventDefault();
                event.stopPropagation();
                sluitZoek();
            }
            else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                event.preventDefault();
                if (zoekPaneel.hidden) werkZoekBij();
                if (zoekResultaten.length) {
                    var volgend = zoekActief < 0 ? (event.key === 'ArrowDown' ? 0 : zoekResultaten.length - 1) : (zoekActief + (event.key === 'ArrowDown' ? 1 : -1) + zoekResultaten.length) % zoekResultaten.length;
                    activeerResultaat(volgend);
                }
            } else if (event.key === 'Enter' && !zoekPaneel.hidden) {
                event.preventDefault(); kiesZoekresultaat(Math.max(0, zoekActief));
            }
        });
        zoekWis.addEventListener('click', function () {
            zoekveld.value = ''; sluitPlaats(); werkZoekBij(); zoekveld.focus();
        });
        zoekAlles.addEventListener('click', function () {
            boekSelect.value = ''; hoofdstukSelect.value = ''; hoofdstukSelect.disabled = true;
            ['f-zeker', 'f-waarschijnlijk', 'f-onzeker'].forEach(function (id) { document.getElementById(id).checked = true; });
            pasFilterToe(); werkZoekBij(); zoekveld.focus();
        });
        document.addEventListener('pointerdown', function (event) { if (!zoek.contains(event.target)) sluitZoek(); });
        document.addEventListener('focusin', function (event) { if (!zoek.contains(event.target)) sluitZoek(); });

        Promise.all([
            Verification.loadJSON('data/geografie-runtime.geojson'),
            fetch('data/books.json').then(function (r) { return r.json(); }).catch(function () { return { books: [] }; })
        ]).then(function (res) {
            (res[1].books || []).forEach(function (b) { BOOKNAMES[b.id] = b.nameDutch || b.id; });
            var manifest = { books: res[1].books || [] };
            var inData = {};
            verificationSourceHash = res[0]._verificationSourceHash;
            (res[0].features || []).forEach(function (feature) { (feature.properties.refs || []).forEach(function (ref) { inData[ref.boek] = true; }); });
            var volgorde = window.getFlatBookOrder ? window.getFlatBookOrder('canoniek', manifest) : Object.keys(inData);
            volgorde.concat(Object.keys(inData)).filter(function (id, i, arr) { return inData[id] && arr.indexOf(id) === i; }).forEach(function (id) {
                var option = document.createElement('option'); option.value = id; option.textContent = BOOKNAMES[id] || id; boekSelect.appendChild(option);
            });
            var params = new URLSearchParams(window.location.search);
            if (params.get('boek') && inData[params.get('boek')]) boekSelect.value = params.get('boek');
            function vulHoofdstukken(gekozen) {
                hoofdstukSelect.innerHTML = '<option value="">Alle hoofdstukken</option>';
                hoofdstukSelect.disabled = !gekozen;
                if (!gekozen) return;
                var chapters = {};
                (res[0].features || []).forEach(function (feature) { (feature.properties.refs || []).forEach(function (ref) { if (ref.boek === gekozen) chapters[ref.hoofdstuk] = true; }); });
                Object.keys(chapters).map(Number).sort(function (a, b) { return a - b; }).forEach(function (chapter) {
                    var option = document.createElement('option'); option.value = chapter; option.textContent = 'Hoofdstuk ' + chapter; hoofdstukSelect.appendChild(option);
                });
            }
            vulHoofdstukken(boekSelect.value);
            if (boekSelect.value && params.get('hoofdstuk') && hoofdstukSelect.querySelector('option[value="' + Number(params.get('hoofdstuk')) + '"]')) hoofdstukSelect.value = Number(params.get('hoofdstuk'));
            boekSelect.addEventListener('change', function () { vulHoofdstukken(this.value); pasFilterToe(); pasBeeldAan(); });
            hoofdstukSelect.addEventListener('change', function () { pasFilterToe(); pasBeeldAan(); });
            var feats = new ol.format.GeoJSON().readFeatures(res[0], { dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3857' });
            vectorSource.addFeatures(feats);
            pasFilterToe();
            zoekGereed = true;
            zoekveld.disabled = false;
            zoekveld.placeholder = 'Zoek een plaats…';
            zoekStatus.textContent = 'Zoek op naam, andere schrijfwijze of moderne plaatsnaam.';
            var gevraagdePlaats = new URLSearchParams(window.location.search).get('plaats');
            var gekozen = gevraagdePlaats && feats.find(function (feat) {
                var gevraagd = gevraagdePlaats.toLocaleLowerCase('nl');
                return String(feat.get('id') || '').toLocaleLowerCase('nl') === gevraagd ||
                    (feat.get('legacyIds') || []).some(function (id) { return String(id).toLocaleLowerCase('nl') === gevraagd; }) ||
                    String(feat.get('naam') || '').toLocaleLowerCase('nl') === gevraagd ||
                    (feat.get('aliases') || []).some(function (alias) { return String(alias).toLocaleLowerCase('nl') === gevraagd; });
            });
            if (gekozen && plaatsZichtbaar(gekozen, filters())) {
                selecteerPlaats(gekozen, true);
            } else if (feats.length) {
                pasBeeldAan();
            }
        }).catch(function (e) {
            document.getElementById('telling').textContent = 'Kon kaartgegevens niet laden.';
            zoekveld.disabled = true; zoekveld.placeholder = 'Plaatsen niet beschikbaar';
            zoekStatus.textContent = 'Kaartgegevens konden niet laden. Vernieuw de pagina om opnieuw te proberen.';
            zoekPaneel.hidden = false;
            console.error(e);
        });
    })();
    </script>
