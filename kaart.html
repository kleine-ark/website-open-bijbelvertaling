    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; background: var(--bg-page, #f8f6f2); overflow: hidden; }
        .kaart-kop { flex: 0 0 auto; padding: 12px 20px 10px; border-bottom: 1px solid var(--border, #d4d0c8); background: var(--bg-surface, #fff); }
        .kaart-kop h1 { font-family: var(--font-cursive); font-weight: 400; font-size: 26px; color: var(--navy); margin: 0 0 2px; }
        .kaart-kop p { margin: 0 0 8px; font-size: 13px; color: var(--teal); }
        .kaart-kop p a { color: var(--gold); }
        .kaart-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: 13px; }
        .kaart-filters label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--navy); }
        .kaart-filters .telling { color: var(--teal); font-weight: 600; }
        #map { flex: 1 1 auto; width: 100%; background: #e9e5da; }
        .ol-popup { position: absolute; background: #fff; box-shadow: 0 2px 12px rgba(20,46,66,.25); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border, #d4d0c8); min-width: 210px; max-width: 280px; bottom: 14px; left: -120px; font-family: var(--font-body); }
        .ol-popup:after { content: ""; position: absolute; bottom: -10px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top-color: #fff; }
        .ol-popup h3 { margin: 0 0 2px; font-size: 16px; color: var(--navy); font-family: var(--font-serif); }
        .ol-popup .pp-type { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--gold); font-weight: 600; }
        .ol-popup .pp-modern { font-size: 12.5px; color: #666; margin: 5px 0; }
        .ol-popup .pp-toel { font-size: 13px; color: #333; line-height: 1.45; margin: 6px 0; }
        .ol-popup .pp-refs { font-size: 12.5px; margin-top: 6px; }
        .ol-popup .pp-refs a { color: var(--gold); text-decoration: none; margin-right: 8px; }
        .ol-popup .pp-zeker { display: inline-block; margin-top: 6px; font-size: 11px; padding: 1px 7px; border-radius: 10px; }
        .ol-popup-closer { position: absolute; top: 6px; right: 9px; text-decoration: none; color: #999; font-size: 15px; }
        .z-zeker { background: rgba(92,184,92,.18); color: #3d7a3d; }
        .z-waarschijnlijk { background: rgba(203,164,73,.20); color: #8a6d1f; }
        .z-onzeker { background: rgba(150,150,150,.20); color: #666; }
        :root[data-theme="donker"] body { background: var(--bg-page); }
        :root[data-theme="donker"] .kaart-kop { background: var(--bg-surface); border-color: var(--border-default, #333); }
        :root[data-theme="donker"] .kaart-kop h1 { color: var(--text-primary); }
        :root[data-theme="donker"] .kaart-filters label { color: var(--text-primary); }
        :root[data-theme="donker"] .ol-popup { background: var(--bg-surface); border-color: var(--border-default, #333); color: var(--text-primary); }
        :root[data-theme="donker"] .ol-popup:after { border-top-color: var(--bg-surface); }
        :root[data-theme="donker"] .ol-popup h3 { color: var(--text-primary); }
        :root[data-theme="donker"] .ol-popup .pp-toel { color: var(--text-secondary, #bbb); }
    </style>
    <script>(function(){try{var s=localStorage.getItem("sv2026_vertaalopties");var t=s?(JSON.parse(s).thema||"auto"):"auto";if(t==="auto"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"donker":"licht";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>

    <div class="kaart-kop">
        <h1>Kaart van Gods Woord</h1>
        <p>Geografische aanduidingen uit Gods Woord op de kaart. Klik op een plaats voor toelichting en verwijzingen. &nbsp;<a href="geografie.html">Alle geografische aanduidingen →</a></p>
        <div class="kaart-filters">
            <span class="telling" id="telling">…</span>
            <label><input type="checkbox" id="f-zeker" checked> Zeker</label>
            <label><input type="checkbox" id="f-waarschijnlijk"> Waarschijnlijk</label>
            <label><input type="checkbox" id="f-onzeker"> Onzeker</label>
        </div>
    </div>
    <div id="map"></div>
    <div id="popup" class="ol-popup" style="display:none;">
        <a href="#" id="popup-closer" class="ol-popup-closer">✕</a>
        <div id="popup-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>
    <script src="js/book-orders.js"></script>
    <script>
    (function () {
        var BOOKNAMES = {};
        function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
        function prettyRef(ref) { var sp = ref.lastIndexOf(' '); var b = ref.slice(0, sp); return (BOOKNAMES[b] || (b.charAt(0).toUpperCase() + b.slice(1))) + ' ' + ref.slice(sp + 1); }
        function refHref(ref) { var sp = ref.lastIndexOf(' '); var b = ref.slice(0, sp); var cv = ref.slice(sp + 1).split(':'); return 'index.html#' + b + '/' + cv[0] + '/' + (cv[1] || ''); }

        var KLEUR = { stad: '#c0392b', dorp: '#c0392b', land: '#8e44ad', streek: '#8e44ad', regio: '#8e44ad', berg: '#6b4b2a', rivier: '#2980b9', zee: '#2980b9', meer: '#2980b9', eiland: '#16a085' };
        function markerStyle(feat, sel) {
            var p = feat.getProperties();
            var kleur = KLEUR[p.type] || '#555';
            var zeker = p.zekerheid === 'zeker';
            return new ol.style.Style({
                image: new ol.style.Circle({
                    radius: sel ? 8 : 6,
                    fill: new ol.style.Fill({ color: kleur }),
                    stroke: new ol.style.Stroke({ color: zeker ? '#fff' : 'rgba(255,255,255,.6)', width: zeker ? 2 : 1.5 })
                }),
                text: new ol.style.Text({
                    text: p.naam, font: '12px "Fira Sans", sans-serif', offsetY: -14,
                    fill: new ol.style.Fill({ color: '#142e42' }),
                    stroke: new ol.style.Stroke({ color: 'rgba(255,255,255,.85)', width: 3 }),
                    overflow: true
                })
            });
        }

        var vectorSource = new ol.source.Vector();
        var vectorLayer = new ol.layer.Vector({ source: vectorSource, style: function (f) { return markerStyle(f, false); } });
        var map = new ol.Map({
            target: 'map',
            layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }), vectorLayer ],
            view: new ol.View({ center: ol.proj.fromLonLat([32, 33]), zoom: 5 })
        });

        var overlay = new ol.Overlay({ element: document.getElementById('popup'), autoPan: { animation: { duration: 200 } } });
        map.addOverlay(overlay);
        document.getElementById('popup-closer').onclick = function () { overlay.setPosition(undefined); document.getElementById('popup').style.display = 'none'; return false; };

        function filters() {
            return { zeker: document.getElementById('f-zeker').checked, waarschijnlijk: document.getElementById('f-waarschijnlijk').checked, onzeker: document.getElementById('f-onzeker').checked };
        }
        function pasFilterToe() {
            var f = filters(), zicht = 0;
            vectorSource.forEachFeature(function (feat) {
                var z = feat.get('zekerheid') || 'onzeker';
                var aan = f[z] !== false && (z === 'zeker' ? f.zeker : z === 'waarschijnlijk' ? f.waarschijnlijk : f.onzeker);
                feat.setStyle(aan ? undefined : new ol.style.Style({}));
                if (aan) zicht++;
            });
            document.getElementById('telling').textContent = zicht + ' plaatsen';
        }
        ['f-zeker', 'f-waarschijnlijk', 'f-onzeker'].forEach(function (id) { document.getElementById(id).addEventListener('change', pasFilterToe); });

        map.on('singleclick', function (evt) {
            var feat = map.forEachFeatureAtPixel(evt.pixel, function (f) { return f; });
            if (!feat) { overlay.setPosition(undefined); document.getElementById('popup').style.display = 'none'; return; }
            var p = feat.getProperties();
            var refs = (p.verwijzingen || []).map(function (r) { return '<a href="' + refHref(r) + '">' + esc(prettyRef(r)) + '</a>'; }).join(' ');
            var zl = { zeker: 'Locatie zeker', waarschijnlijk: 'Locatie waarschijnlijk', onzeker: 'Locatie onzeker' }[p.zekerheid] || '';
            document.getElementById('popup-content').innerHTML =
                '<div class="pp-type">' + esc(p.type || '') + '</div>' +
                '<h3>' + esc(p.naam || '') + '</h3>' +
                (p.moderneNaam ? '<div class="pp-modern">Nu: ' + esc(p.moderneNaam) + '</div>' : '') +
                (p.toelichting ? '<div class="pp-toel">' + esc(p.toelichting) + '</div>' : '') +
                (refs ? '<div class="pp-refs">' + refs + '</div>' : '') +
                (zl ? '<span class="pp-zeker z-' + esc(p.zekerheid) + '">' + zl + '</span>' : '');
            document.getElementById('popup').style.display = '';
            overlay.setPosition(feat.getGeometry().getCoordinates());
        });
        map.on('pointermove', function (e) { map.getTargetElement().style.cursor = map.hasFeatureAtPixel(e.pixel) ? 'pointer' : ''; });

        Promise.all([
            fetch('data/geografie.geojson').then(function (r) { return r.json(); }),
            fetch('data/books.json').then(function (r) { return r.json(); }).catch(function () { return { books: [] }; })
        ]).then(function (res) {
            (res[1].books || []).forEach(function (b) { BOOKNAMES[b.id] = b.nameDutch || b.id; });
            var feats = new ol.format.GeoJSON().readFeatures(res[0], { dataProjection: 'EPSG:4326', featureProjection: 'EPSG:3857' });
            vectorSource.addFeatures(feats);
            pasFilterToe();
            if (feats.length) {
                var ext = vectorSource.getExtent();
                map.getView().fit(ext, { padding: [50, 50, 50, 50], maxZoom: 7, duration: 300 });
            }
        }).catch(function (e) { document.getElementById('telling').textContent = 'Kon kaartgegevens niet laden.'; console.error(e); });
    })();
    </script>
    <script>(function(){var b=document.getElementById('topnav-theme-toggle');if(!b)return;b.addEventListener('click',function(){try{var s=JSON.parse(localStorage.getItem('sv2026_vertaalopties')||'{}');var cur=document.documentElement.dataset.theme==='donker'?'licht':'donker';s.thema=cur;localStorage.setItem('sv2026_vertaalopties',JSON.stringify(s));document.documentElement.setAttribute('data-theme',cur);}catch(e){console.error(e);}});})();</script>

    <script src="js/auth.js"></script>
