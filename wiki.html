    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: block; margin: 0; }
        .wiki-shell { display: flex; min-height: calc(100vh - 52px); }
        .wiki-sidebar {
            width: 220px; min-width: 220px; background: #f5f2ed;
            border-right: 1px solid #e5e1d8; padding: 20px 0;
            font-family: 'Fira Sans', sans-serif; font-size: 14px;
            overflow-y: auto;
        }
        .wiki-sidebar .section-label {
            padding: 0 16px 12px; font-size: 11px; font-weight: 600;
            color: #cba449; text-transform: uppercase; letter-spacing: 0.08em;
        }
        .wiki-sidebar .section-label.lexicons {
            margin-top: 12px; padding-top: 12px;
        }
        .wiki-sidebar a {
            display: block; padding: 8px 20px; color: #333;
            text-decoration: none; border-left: 3px solid transparent;
            cursor: pointer;
        }
        .wiki-sidebar a:hover { background: rgba(203,164,73,0.08); }
        /* Onderwerpgroepen. Het aantal pagina's groeit, dus elke groep is in
           te klappen; de stand blijft bewaard tussen bezoeken. */
        .wiki-groep + .wiki-groep { margin-top: 2px; }
        .wiki-groep-kop {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; text-align: left; cursor: pointer;
            background: none; border: none;
            padding: 10px 16px 6px;
            font: 600 11px 'Fira Sans', sans-serif;
            color: #cba449; text-transform: uppercase; letter-spacing: 0.08em;
        }
        .wiki-groep-kop::after {
            content: '▾'; font-size: 11px; line-height: 1;
            transition: transform 0.15s ease; color: inherit;
        }
        .wiki-groep-kop[aria-expanded="false"]::after { transform: rotate(-90deg); }
        .wiki-groep-kop:hover { background: rgba(203,164,73,0.08); }
        .wiki-groep-kop:focus-visible { outline: 2px solid #cba449; outline-offset: -2px; }
        .wiki-groep-kop[aria-expanded="false"] + .wiki-groep-inhoud { display: none; }
        .wiki-sidebar a.active {
            color: #142e42; font-weight: 600;
            border-left-color: #cba449; background: rgba(203,164,73,0.08);
        }
        .wiki-iframe {
            flex: 1; border: none; min-height: calc(100vh - 52px);
        }
        /* Mobiel: zijmenu inklapbaar */
        .wiki-menu-toggle { display: none; }
        @media (max-width: 768px) {
            .wiki-shell { flex-direction: column; }
            .wiki-menu-toggle {
                display: flex; align-items: center; gap: 8px;
                width: 100%; text-align: left; padding: 12px 16px;
                background: #f5f2ed; border: none; border-bottom: 1px solid #e5e1d8;
                font: 600 14px 'Fira Sans', sans-serif; color: #142e42; cursor: pointer;
            }
            .wiki-sidebar {
                width: 100%; min-width: 0; padding: 6px 0;
                border-right: none; border-bottom: 1px solid #e5e1d8;
            }
            .wiki-sidebar.collapsed { display: none; }
            .wiki-iframe { min-height: calc(100vh - 110px); }
        }
        :root[data-theme="donker"] .wiki-menu-toggle {
            background: var(--bg-surface) !important; color: var(--text-primary) !important;
            border-color: var(--border-default) !important;
        }
    </style>
    <script>(function(){try{var s=localStorage.getItem("sv2026_vertaalopties");var t=s?(JSON.parse(s).thema||"auto"):"auto";if(t==="auto"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"donker":"licht";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
    <nav id="topnav"></nav>
    <script src="js/topnav.js"></script>

    <div class="wiki-shell">
        <button class="wiki-menu-toggle" id="wiki-menu-toggle" aria-label="Documentatie-menu in-/uitklappen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            Documentatie-menu
        </button>
        <nav class="wiki-sidebar">
            <!-- Groepen per onderwerp, elk in te klappen. Het aantal pagina's
                 groeit, dus een platte lijst wordt op den duur onoverzichtelijk. -->
            <div class="wiki-groep" data-groep="verkennen">
                <button type="button" class="wiki-groep-kop" aria-expanded="true">Verkennen</button>
                <div class="wiki-groep-inhoud">
                    <a href="#kaart" data-page="kaart.html">Kaart</a>
                    <a href="#stamboom" data-page="stamboom.html">Stamboom</a>
                </div>
            </div>

            <div class="wiki-groep" data-groep="vertaling">
                <button type="button" class="wiki-groep-kop" aria-expanded="true">De vertaling</button>
                <div class="wiki-groep-inhoud">
                    <a href="#uitgangspunten" data-page="uitgangspunten.html" class="active">Uitgangspunten &amp; techniek</a>
                    <a href="#principes" data-page="principes.html">Wijzigingsprincipes</a>
                    <a href="#statistieken" data-page="statistieken.html">Statistieken</a>
                    <a href="#changelog" data-page="changelog.html">Changelog</a>
                </div>
            </div>

            <div class="wiki-groep" data-groep="naslag">
                <button type="button" class="wiki-groep-kop" aria-expanded="true">Naslag</button>
                <div class="wiki-groep-inhoud">
                    <a href="#begrippen" data-page="begrippen.html">Begrippen</a>
                    <a href="#maateenheden" data-page="maateenheden.html">Maten, gewichten &amp; munten</a>
                    <a href="#grondteksten" data-page="grondteksten.html">Grondteksten</a>
                    <a href="#handschriften" data-page="handschriften.html">Handschriften</a>
                    <a href="#geografie" data-page="geografie.html">Geografische aanduidingen</a>
                </div>
            </div>

            <div class="wiki-groep" data-groep="downloaden">
                <button type="button" class="wiki-groep-kop" aria-expanded="true">Downloaden</button>
                <div class="wiki-groep-inhoud">
                    <a href="#downloads" data-page="downloads.html">Downloads</a>
                </div>
            </div>
        </nav>

        <iframe id="wiki-frame" class="wiki-iframe" src="uitgangspunten.html"></iframe>
    </div>

    <script>
    (function() {
        var sidebar = document.querySelector('.wiki-sidebar');
        var iframe = document.getElementById('wiki-frame');
        var links = sidebar.querySelectorAll('a[data-page]');

        // Iframe-thema synchroon houden met de parent (anders licht/donker omgekeerd)
        function syncIframeTheme() {
            try {
                var theme = document.documentElement.getAttribute('data-theme') || 'licht';
                var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
                if (doc && doc.documentElement) doc.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        }
        iframe.addEventListener('load', syncIframeTheme);
        window.WikiSyncIframeTheme = syncIframeTheme;

        // Mobiel: zijmenu inklapbaar (standaard ingeklapt; sluit na een keuze)
        var isMobile = function() { return window.matchMedia('(max-width: 768px)').matches; };
        var menuToggle = document.getElementById('wiki-menu-toggle');
        if (menuToggle) menuToggle.addEventListener('click', function() { sidebar.classList.toggle('collapsed'); });
        if (isMobile()) sidebar.classList.add('collapsed');
        links.forEach(function(a) {
            a.addEventListener('click', function() { if (isMobile()) sidebar.classList.add('collapsed'); });
        });

        // Groepen in- en uitklappen; de stand blijft bewaard. De groep waarin
        // de geopende pagina staat gaat altijd open, anders lijkt hij weg.
        var GROEP_SLEUTEL = 'ov_wiki_groepen';
        var dicht = {};
        try { dicht = JSON.parse(localStorage.getItem(GROEP_SLEUTEL) || '{}') || {}; } catch (e) { dicht = {}; }

        var groepen = sidebar.querySelectorAll('.wiki-groep');
        groepen.forEach(function (g) {
            var kop = g.querySelector('.wiki-groep-kop');
            var naam = g.getAttribute('data-groep');
            if (dicht[naam]) kop.setAttribute('aria-expanded', 'false');
            kop.addEventListener('click', function () {
                var open = kop.getAttribute('aria-expanded') !== 'false';
                kop.setAttribute('aria-expanded', open ? 'false' : 'true');
                dicht[naam] = open;
                try { localStorage.setItem(GROEP_SLEUTEL, JSON.stringify(dicht)); } catch (e) {}
            });
        });

        function openGroepVan(link) {
            var g = link.closest('.wiki-groep');
            if (!g) return;
            var kop = g.querySelector('.wiki-groep-kop');
            if (kop && kop.getAttribute('aria-expanded') === 'false') {
                kop.setAttribute('aria-expanded', 'true');
                dicht[g.getAttribute('data-groep')] = false;
                try { localStorage.setItem(GROEP_SLEUTEL, JSON.stringify(dicht)); } catch (e) {}
            }
        }

        // Map hash to page
        var hashMap = {};
        links.forEach(function(link) {
            var hash = link.getAttribute('href').replace('#', '');
            hashMap[hash] = link;
        });

        function loadPage(hash) {
            var link = hashMap[hash];
            if (!link) return;
            // Update active state
            links.forEach(function(l) { l.classList.remove('active'); });
            link.classList.add('active');
            openGroepVan(link);
            // Load in iframe
            iframe.src = link.getAttribute('data-page');
        }

        // Click handler
        links.forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                var hash = this.getAttribute('href').replace('#', '');
                window.location.hash = hash;
                loadPage(hash);
            });
        });

        // Handle initial hash or default
        function handleHash() {
            var hash = window.location.hash.replace('#', '');
            if (hash && hashMap[hash]) {
                loadPage(hash);
            }
        }

        // Listen for hash changes (back/forward)
        window.addEventListener('hashchange', handleHash);

        // Initial load
        if (window.location.hash) {
            handleHash();
        }
    })();
    </script>
<script>(function(){var b=document.getElementById('topnav-theme-toggle');if(!b)return;b.addEventListener('click',function(){try{var s=JSON.parse(localStorage.getItem('sv2026_vertaalopties')||'{}');var cur=document.documentElement.dataset.theme==='donker'?'licht':'donker';s.thema=cur;localStorage.setItem('sv2026_vertaalopties',JSON.stringify(s));document.documentElement.setAttribute('data-theme',cur);if(window.WikiSyncIframeTheme)window.WikiSyncIframeTheme();document.querySelectorAll('input[data-optie="thema"]').forEach(function(r){r.checked=(r.value===cur);});}catch(e){console.error(e);}});})();</script>

<script src="js/stats-inject.js"></script>
