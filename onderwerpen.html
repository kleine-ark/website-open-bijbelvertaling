<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onderwerpen — Open Staten Vertaling</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: block; background: #f8f6f2; }
        .page { max-width: 900px; margin: 0 auto; padding: 50px 24px 90px; font-family: var(--font-body); }
        .page h1 { font-family: var(--font-cursive); font-size: 38px; color: var(--navy); font-weight: 400; margin-bottom: 8px; }
        .page .intro { line-height: 1.7; margin-bottom: 22px; color: #444; max-width: 640px; }
        .ond-zoek { width: 100%; max-width: 360px; padding: 9px 14px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 15px; margin-bottom: 26px; }
        .ond-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
        .ond-card { background: #fff; border: 1px solid #e5e1d8; border-radius: 10px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(20,46,66,0.05); }
        .ond-card h2 { font-size: 18px; color: var(--navy); margin: 0 0 6px; display: flex; align-items: center; gap: 9px; font-weight: 600; }
        .ond-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
        .ond-card .beschr { font-size: 13.5px; color: #666; line-height: 1.55; margin: 0 0 12px; }
        .ond-card .count { font-size: 12px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .ond-verzen { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
        .ond-verzen a { display: inline-block; font-size: 13px; color: var(--navy); background: var(--bg-surface-alt, #f5f2ed); border: 1px solid #e7e1d4; border-radius: 6px; padding: 3px 9px; text-decoration: none; }
        .ond-verzen a:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
        .ond-verzen a .ster { color: var(--gold); }
        .ond-verzen a:hover .ster { color: #fff; }
        .ond-empty { color: #999; }
        /* Donker thema */
        :root[data-theme="donker"] body { background: var(--bg-page); }
        :root[data-theme="donker"] .page h1 { color: var(--text-primary); }
        :root[data-theme="donker"] .page .intro { color: var(--text-secondary, #bbb); }
        :root[data-theme="donker"] .ond-card { background: var(--bg-surface) !important; border-color: var(--border-default, #333) !important; }
        :root[data-theme="donker"] .ond-card h2 { color: var(--text-primary); }
        :root[data-theme="donker"] .ond-card .beschr { color: var(--text-secondary, #aaa); }
        :root[data-theme="donker"] .ond-verzen a { background: var(--bg-surface-alt, #1c1c1c); color: var(--text-primary); border-color: #333; }
        :root[data-theme="donker"] .ond-zoek { background: var(--bg-surface); color: var(--text-primary); border-color: #333; }
    </style>
    <script>(function(){try{var s=localStorage.getItem("sv2026_vertaalopties");var t=s?(JSON.parse(s).thema||"auto"):"auto";if(t==="auto"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"donker":"licht";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
    <nav id="topnav">
    <div class="topnav-brand">Open Staten Vertaling<span class="topnav-version"><a href="changelog.html" style="color:#cba449;text-decoration:none;">v0.19.0</a></span></div>
    <div class="topnav-links" id="topnav-links">
        <a href="over-ov.html">Over OSV</a>
        <a href="index.html#johannes/1">Tekst</a>
        <a href="onderwerpen.html" class="active">Onderwerpen</a>
        <a href="wiki.html">Wiki</a>
        <a href="contact.html">Over ons</a>
    </div>
    <input type="search" id="topnav-search-input" class="topnav-search-input" placeholder="Zoek in Gods Woord… (Ctrl+K)" autocomplete="off" aria-label="Zoeken in Gods Woord" onkeydown="if(event.key==='Enter'){var q=this.value.trim();if(q){location.href='index.html?q='+encodeURIComponent(q);}}">
    <button class="topnav-theme" id="topnav-theme-toggle" title="Thema: licht/donker" aria-label="Wissel thema"><svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    <div id="auth-slot" class="topnav-auth"></div>
    <button class="topnav-hamburger" id="topnav-hamburger" onclick="document.getElementById('topnav-links').classList.toggle('open');this.classList.toggle('open')" title="Menu" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
</nav>

    <div class="page">
        <h1>Onderwerpen</h1>
        <p class="intro">Bijbelgedeelten geordend op thema. Klik op een vers om het in de tekst te openen. Een <span style="color:var(--gold);">&#9733;</span> markeert een sleuteltekst.</p>
        <input type="search" class="ond-zoek" id="ond-zoek" placeholder="Filter op onderwerp…" aria-label="Filter op onderwerp">
        <div class="ond-grid" id="ond-grid"><p class="ond-empty">Onderwerpen laden…</p></div>
        <p style="margin-top:40px;"><a href="/" style="color:var(--gold);">← Terug naar de tekst</a></p>
    </div>

    <script>
    (function () {
        const grid = document.getElementById('ond-grid');
        function refToHref(ref) {
            // "genesis 1:3" -> "index.html#genesis/1"
            const sp = ref.lastIndexOf(' ');
            const book = ref.slice(0, sp);
            const chv = ref.slice(sp + 1);
            const ch = chv.split(':')[0];
            return `index.html#${book}/${ch}`;
        }
        function render(tags) {
            if (!tags || !tags.length) { grid.innerHTML = '<p class="ond-empty">Nog geen onderwerpen.</p>'; return; }
            tags.sort((a, b) => (b.verzen ? b.verzen.length : 0) - (a.verzen ? a.verzen.length : 0));
            grid.innerHTML = tags.map(tag => {
                const verzen = (tag.verzen || [])
                    .map(it => typeof it === 'string' ? { ref: it, rang: 3 } : it)
                    .sort((a, b) => (a.rang || 3) - (b.rang || 3));
                const items = verzen.map(it => {
                    const ster = (it.rang === 1) ? '<span class="ster">&#9733;</span> ' : '';
                    return `<li><a href="${refToHref(it.ref)}" title="${(it.notitie || '').replace(/"/g,'&quot;')}">${ster}${it.ref}</a></li>`;
                }).join('');
                return `<div class="ond-card" data-naam="${(tag.naam || '').toLowerCase()}">
                    <h2><span class="ond-dot" style="background:${tag.kleur || '#999'}"></span>${tag.naam || ''}</h2>
                    ${tag.beschrijving ? `<p class="beschr">${tag.beschrijving}</p>` : ''}
                    <div class="count">${verzen.length} vers${verzen.length === 1 ? '' : 'en'}</div>
                    <ul class="ond-verzen">${items}</ul>
                </div>`;
            }).join('');
        }
        // Filter
        document.getElementById('ond-zoek').addEventListener('input', function () {
            const q = this.value.trim().toLowerCase();
            document.querySelectorAll('.ond-card').forEach(c => {
                c.style.display = (!q || c.dataset.naam.includes(q)) ? '' : 'none';
            });
        });
        // Data: lokale toevoegingen (ov_tags) hebben voorrang, anders tags.json
        let local = null;
        try { local = JSON.parse(localStorage.getItem('ov_tags')); } catch (e) {}
        if (local && local.tags && local.tags.length) {
            render(local.tags);
        } else {
            fetch('data/tags.json').then(r => r.json()).then(d => render(d.tags || []))
                .catch(() => { grid.innerHTML = '<p class="ond-empty">Onderwerpen konden niet geladen worden.</p>'; });
        }
    })();
    </script>
    <script>(function(){var b=document.getElementById('topnav-theme-toggle');if(!b)return;b.addEventListener('click',function(){try{var s=JSON.parse(localStorage.getItem('sv2026_vertaalopties')||'{}');var cur=document.documentElement.dataset.theme==='donker'?'licht':'donker';s.thema=cur;localStorage.setItem('sv2026_vertaalopties',JSON.stringify(s));document.documentElement.setAttribute('data-theme',cur);}catch(e){console.error(e);}});})();</script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stats-inject.js"></script>
</body>
</html>
