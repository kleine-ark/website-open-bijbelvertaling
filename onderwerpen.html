    <style>
        body { display: block; background: #f8f6f2; }
        .page { max-width: 900px; margin: 0 auto; padding: 50px 24px 90px; font-family: var(--font-body); }
        .page h1 { font-family: var(--font-cursive); font-size: 38px; color: var(--navy); font-weight: 400; margin-bottom: 8px; }
        .page .intro { line-height: 1.7; margin-bottom: 22px; color: #444; max-width: 640px; }
        .ond-zoek { width: 100%; max-width: 360px; padding: 9px 14px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 15px; margin-bottom: 26px; }
        .ond-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
        .ond-card { background: #fff; border: 1px solid #e5e1d8; border-radius: 10px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(20,46,66,0.05); text-align: left; width: 100%; font: inherit; cursor: pointer; transition: box-shadow .15s, transform .1s; }
        .ond-card:hover { box-shadow: 0 4px 14px rgba(20,46,66,0.12); transform: translateY(-1px); }
        /* Detailweergave */
        .ond-terug { background: none; border: none; color: var(--gold); font-size: 14px; cursor: pointer; padding: 0 0 14px; font-weight: 600; }
        #ond-detail h2 { font-size: 24px; color: var(--navy); display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-weight: 600; }
        .beschr-detail { color: #555; line-height: 1.6; margin: 0 0 6px; max-width: 640px; }
        .ond-verzen-lijst { list-style: none; padding: 0; margin: 14px 0 0; max-width: 680px; }
        .ond-vers { margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid #eee; }
        .ond-vers-kop { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; color: var(--gold); margin-bottom: 3px; }
        .ond-vers-kop a { color: var(--gold); text-decoration: none; }
        .ond-vers-kop a:hover { text-decoration: underline; }
        .ond-vers-kop .ster { color: var(--gold); }
        .ond-vers-tekst { font-family: var(--font-serif, 'EB Garamond', Georgia, serif); font-size: 1.02em; line-height: 1.6; color: #222; min-height: 1.4em; }
        .ond-vers-tekst .osv-bron { display: none; }
        .ond-vers .vnote { font-style: italic; color: #888; font-weight: 400; }
        :root[data-theme="donker"] .ond-vers { border-color: #2a2a2a; }
        :root[data-theme="donker"] .ond-vers-tekst { color: var(--text-primary); }
        :root[data-theme="donker"] #ond-detail h2 { color: var(--text-primary); }
        :root[data-theme="donker"] .beschr-detail { color: var(--text-secondary, #aaa); }
        :root[data-theme="donker"] .ond-verzen-lijst a { color: var(--text-primary); }
        .ond-card h2 { font-size: 18px; color: var(--navy); margin: 0 0 6px; display: flex; align-items: center; gap: 9px; font-weight: 600; }
        .ond-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
        .ond-card .beschr { font-size: 13.5px; color: #666; line-height: 1.55; margin: 0 0 12px; }
        .ond-card .count { font-size: 12px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .ond-verzen { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
        .ond-verzen a { display: inline-block; font-size: 13px; color: var(--navy); background: var(--bg-surface-alt, #f5f2ed); border: 1px solid #e7e1d4; border-radius: 6px; padding: 3px 9px; text-decoration: none; }
        .ond-verzen a:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
        .ond-verzen a .ster { color: var(--gold); }
        .ond-verzen a:hover .ster { color: #fff; }
        .ond-empty { color: #999; }
        /* Donker thema */
        :root[data-theme="donker"] body { background: var(--bg-page); }
        :root[data-theme="donker"] .page h1 { color: var(--text-primary); }
        :root[data-theme="donker"] .page .intro { color: var(--text-secondary, #bbb); }
        :root[data-theme="donker"] .ond-card { background: var(--bg-surface) !important; border-color: var(--border-default, #333) !important; }
        :root[data-theme="donker"] .ond-card h2 { color: var(--text-primary); }
        :root[data-theme="donker"] .ond-card .beschr { color: var(--text-secondary, #aaa); }
        :root[data-theme="donker"] .ond-verzen a { background: var(--bg-surface-alt, #1c1c1c); color: var(--text-primary); border-color: #333; }
        :root[data-theme="donker"] .ond-zoek { background: var(--bg-surface); color: var(--text-primary); border-color: #333; }
    </style>
    <script>(function(){try{var s=localStorage.getItem("sv2026_vertaalopties");var t=s?(JSON.parse(s).thema||"auto"):"auto";if(t==="auto"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"donker":"licht";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>

    <button class="topnav-theme" id="topnav-theme-toggle" title="Thema: licht/donker" aria-label="Wissel thema"><svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>

    <div class="page">
        <h1>Onderwerpen</h1>
        <p class="intro">Bijbelgedeelten geordend op thema. Klik op een vers om het in de tekst te openen. Een <span style="color:var(--gold);">&#9733;</span> markeert een sleuteltekst.</p>
        <input type="search" class="ond-zoek" id="ond-zoek" placeholder="Filter op onderwerp…" aria-label="Filter op onderwerp">
        <div class="ond-grid" id="ond-grid"><p class="ond-empty">Onderwerpen laden…</p></div>

        <!-- Detailweergave van één onderwerp -->
        <div id="ond-detail" style="display:none;">
            <button id="ond-terug" class="ond-terug">&#8249; Alle onderwerpen</button>
            <h2 id="ond-detail-titel"></h2>
            <p id="ond-detail-beschr" class="beschr-detail"></p>
            <div id="ond-detail-count" class="count"></div>
            <ul class="ond-verzen-lijst" id="ond-detail-lijst"></ul>
        </div>

        <p style="margin-top:40px;"><a href="/" style="color:var(--gold);">← Terug naar de tekst</a></p>
    </div>

    <script>
    (function () {
        const grid = document.getElementById('ond-grid');
        const zoek = document.getElementById('ond-zoek');
        const detail = document.getElementById('ond-detail');
        let TAGS = [];

        function refToHref(ref) {
            const sp = ref.lastIndexOf(' ');
            const book = ref.slice(0, sp);
            const ch = ref.slice(sp + 1).split(':')[0];
            return `index.html#${book}/${ch}`;
        }
        function verzenVan(tag) {
            return (tag.verzen || [])
                .map(it => typeof it === 'string' ? { ref: it, rang: 3 } : it)
                .sort((a, b) => (a.rang || 3) - (b.rang || 3));
        }
        // Lazy: laad de verstekst via de OSV-bibliotheek zodra een item in beeld komt
        let _io = null;
        function observeTeksten(root) {
            if (_io) _io.disconnect();
            _io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (!e.isIntersecting) return;
                    const el = e.target; _io.unobserve(el);
                    const ref = el.dataset.ref;
                    if (window.OSV) {
                        OSV.cite(ref, { link: false }).then(r => { el.innerHTML = r.html; }).catch(() => {});
                    }
                });
            }, { rootMargin: '400px' });
            root.querySelectorAll('.ond-vers-tekst[data-ref]').forEach(el => _io.observe(el));
        }
        function toonGrid() {
            detail.style.display = 'none';
            grid.style.display = '';
            zoek.style.display = '';
            if (!TAGS.length) { grid.innerHTML = '<p class="ond-empty">Nog geen onderwerpen.</p>'; return; }
            const sorted = [...TAGS].sort((a, b) => (b.verzen ? b.verzen.length : 0) - (a.verzen ? a.verzen.length : 0));
            grid.innerHTML = sorted.map(tag => {
                const n = (tag.verzen || []).length;
                return `<button class="ond-card" data-id="${tag.id}" data-naam="${(tag.naam || '').toLowerCase()}">
                    <h2><span class="ond-dot" style="background:${tag.kleur || '#999'}"></span>${tag.naam || ''}</h2>
                    ${tag.beschrijving ? `<p class="beschr">${tag.beschrijving}</p>` : ''}
                    <div class="count">${n} vers${n === 1 ? '' : 'en'} &rsaquo;</div>
                </button>`;
            }).join('');
            grid.querySelectorAll('.ond-card').forEach(c =>
                c.addEventListener('click', () => toonDetail(c.dataset.id)));
        }
        function toonDetail(id) {
            const tag = TAGS.find(t => t.id === id);
            if (!tag) return;
            grid.style.display = 'none';
            zoek.style.display = 'none';
            detail.style.display = '';
            const verzen = verzenVan(tag);
            document.getElementById('ond-detail-titel').innerHTML =
                `<span class="ond-dot" style="background:${tag.kleur || '#999'}"></span>${tag.naam || ''}`;
            document.getElementById('ond-detail-beschr').textContent = tag.beschrijving || '';
            document.getElementById('ond-detail-count').textContent = `${verzen.length} vers${verzen.length === 1 ? '' : 'en'}`;
            const lijst = document.getElementById('ond-detail-lijst');
            lijst.innerHTML = verzen.map(it => {
                const ster = (it.rang === 1) ? '<span class="ster">&#9733;</span> ' : '';
                const note = it.notitie ? `<span class="vnote">${it.notitie}</span>` : '';
                return `<li class="ond-vers">
                    <div class="ond-vers-kop">${ster}<a href="${refToHref(it.ref)}">${it.ref}</a>${note}</div>
                    <div class="ond-vers-tekst osv-cite" data-ref="${it.ref}"></div>
                </li>`;
            }).join('');
            observeTeksten(lijst);
            window.scrollTo(0, 0);
            location.hash = 'tag=' + encodeURIComponent(id);
        }
        document.getElementById('ond-terug').addEventListener('click', () => { location.hash = ''; toonGrid(); });
        zoek.addEventListener('input', function () {
            const q = this.value.trim().toLowerCase();
            document.querySelectorAll('.ond-card').forEach(c => {
                c.style.display = (!q || c.dataset.naam.includes(q)) ? '' : 'none';
            });
        });
        function init(tags) {
            TAGS = tags || [];
            const m = (location.hash || '').match(/tag=([^&]+)/);
            if (m) toonDetail(decodeURIComponent(m[1])); else toonGrid();
        }
        // Spreker-tags (apart bestand) + onderwerp-tags samenvoegen
        Promise.all([
            fetch('data/tags.json').then(r => r.json()).catch(() => ({ tags: [] })),
            fetch('data/spreker-tags.json').then(r => r.ok ? r.json() : { tags: [] }).catch(() => ({ tags: [] }))
        ]).then(([a, b]) => init([...(a.tags || []), ...(b.tags || [])]));
    })();
    </script>
    <script>(function(){var b=document.getElementById('topnav-theme-toggle');if(!b)return;b.addEventListener('click',function(){try{var s=JSON.parse(localStorage.getItem('sv2026_vertaalopties')||'{}');var cur=document.documentElement.dataset.theme==='donker'?'licht':'donker';s.thema=cur;localStorage.setItem('sv2026_vertaalopties',JSON.stringify(s));document.documentElement.setAttribute('data-theme',cur);}catch(e){console.error(e);}});})();</script>
    <script src="embed.js" defer></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stats-inject.js"></script>
</body>
