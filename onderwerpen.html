        .ond-jump a:hover { background: var(--gold); color: #fff; border-color: var(--gold); }

        .beschr-detail { color: #555; line-height: 1.6; margin: 0 0 6px; max-width: 640px; }
        .ond-verzen-lijst { list-style: none; padding: 0; margin: 14px 0 0; max-width: 680px; }
        .ond-vers { margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid #eee; }
        .ond-vers-kop { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; color: var(--gold); margin-bottom: 3px; }
        .ond-vers-kop a { color: var(--gold); text-decoration: none; }
        .ond-vers-kop a:hover { text-decoration: underline; }
        .ond-vers-kop .ster { color: var(--gold); }
        .ond-vers-tekst { font-family: var(--font-serif, 'EB Garamond', Georgia, serif); font-size: 1.02em; line-height: 1.6; color: #222; min-height: 1.4em; cursor: pointer; }
        .ond-vers-tekst .osv-bron { display: none; }

        .ond-vers-tekst .osv-vers.focus-vers { background: rgba(212,160,23,0.14); border-radius: 4px; padding: 2px 6px; margin: 0 -6px 6px; box-shadow: inset 0 0 0 1px rgba(212,160,23,0.22); }
        .ond-vers .vnote { font-style: italic; color: #888; font-weight: 400; }
        .ctx-btn { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: 6px; padding: 0; border: 1px solid var(--gold); background: transparent; color: var(--gold); border-radius: 50%; font-size: 15px; line-height: 1; cursor: pointer; vertical-align: middle; font-family: system-ui, sans-serif; }
        .ctx-btn:hover { background: var(--gold); color: #fff; }
        :root[data-theme="donker"] .ctx-btn { border-color: var(--gold); color: var(--gold); }

        .ond-card h2 { font-family: var(--font-serif); font-size: 20px; color: var(--navy); margin: 0 0 6px; font-weight: 600; line-height: 1.28; letter-spacing: .005em; }
        .ond-card .beschr { font-size: 13.5px; color: #6b6459; line-height: 1.5; margin: 0 0 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .ond-card .count-num { color: var(--navy); font-size: 13px; margin-right: 5px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .ond-card .count-arrow { margin-left: auto; color: var(--gold); font-size: 18px; transition: transform .16s; }
        .ond-card:hover .count-arrow { transform: translateX(3px); }
        #ond-detail h2 .ond-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .ond-verzen { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
        .ond-verzen a { display: inline-block; font-size: 13px; color: var(--navy); background: var(--bg-surface-alt, #f5f2ed); border: 1px solid #e7e1d4; border-radius: 6px; padding: 3px 9px; text-decoration: none; }
        .ond-verzen a:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
        .ond-verzen a .ster { color: var(--gold); }

        :root[data-theme="donker"] body { background: var(--bg-page); }

        :root[data-theme="donker"] .ond-card h2 { color: var(--text-primary); }
        :root[data-theme="donker"] .ond-card .beschr { color: var(--text-secondary, #aaa); }
        :root[data-theme="donker"] .ond-card .count-num { color: var(--text-primary); }
        :root[data-theme="donker"] .ond-zoek:focus { border-color: var(--gold); }
        :root[data-theme="donker"] .ond-verzen a { background: var(--bg-surface-alt, #1c1c1c); color: var(--text-primary); border-color: #333; }
        :root[data-theme="donker"] .ond-zoek { background: var(--bg-surface); color: var(--text-primary); border-color: #333; }
        :root[data-theme="donker"] .ond-jump a { background: var(--bg-surface-alt, #1c1c1c); color: var(--text-primary); border-color: #333; }
        :root[data-theme="donker"] .ond-jump a:hover { background: var(--gold); color: #1a1d24; border-color: var(--gold); }
        :root[data-theme="donker"] .ond-cat-titel { color: var(--text-primary); border-color: #2a2a2a; }

<body>
    <nav id="topnav"></nav>
    <script src="js/topnav.js"></script>

    <div class="page">
        <h1>Onderwerpen</h1>
        <p class="intro">Gedeelten uit Gods Woord, geordend op thema. Klik op een vers om het in de tekst te openen. Een <span style="color:var(--gold);">&#9733;</span> markeert een sleuteltekst. &nbsp;<a href="insluiten.html" style="color:var(--gold);">Een citaat insluiten op je eigen site →</a></p>
        <input type="search" class="ond-zoek" id="ond-zoek" placeholder="Filter op onderwerp…" aria-label="Filter op onderwerp">
        <div class="ond-sections" id="ond-grid"><p class="ond-empty">Onderwerpen laden…</p></div>

        <!-- Detailweergave van één onderwerp -->
        <div id="ond-detail" style="display:none;">
            <button id="ond-terug" class="ond-terug">&#8249; Alle onderwerpen</button>
            <h2 id="ond-detail-titel"></h2>
            <p id="ond-detail-beschr" class="beschr-detail"></p>
            <div id="ond-detail-count" class="count"></div>
            <ul class="ond-verzen-lijst" id="ond-detail-lijst"></ul>
        </div>

        <p style="margin-top:40px;"><a href="/" style="color:var(--gold);">← Terug naar de tekst</a></p>
    </div>

    <script>
    (function () {
        const grid = document.getElementById('ond-grid');
        const zoek = document.getElementById('ond-zoek');
        const detail = document.getElementById('ond-detail');
        let TAGS = [];
        const BOOKORDER = {};
        const BOOKNAMES = {};
        function prettyRef(ref) {
            const sp = ref.lastIndexOf(' ');
            const book = ref.slice(0, sp);
            return (BOOKNAMES[book] || (book.charAt(0).toUpperCase() + book.slice(1))) + ' ' + ref.slice(sp + 1);
        }

        function refToHref(ref) {
            const sp = ref.lastIndexOf(' ');
            const book = ref.slice(0, sp);
            const chv = ref.slice(sp + 1).split(':');
            return `index.html#${book}/${chv[0]}/${chv[1] || ''}`;
        }
        function refKey(ref) {
            const sp = ref.lastIndexOf(' ');
            const book = ref.slice(0, sp);
            const chv = ref.slice(sp + 1).split(':');
            return [BOOKORDER[book] !== undefined ? BOOKORDER[book] : 999, parseInt(chv[0]) || 0, parseInt(chv[1]) || 0];
        }
        function verzenVan(tag) {
            return (tag.verzen || [])
                .map(it => typeof it === 'string' ? { ref: it, rang: 3 } : it)
                .sort((a, b) => {
                    // Eerst op rang (1 = sleuteltekst, bovenaan), dan op canonieke volgorde.
                    const ra = a.rang || 3, rb = b.rang || 3;
                    if (ra !== rb) return ra - rb;
                    const ka = refKey(a.ref), kb = refKey(b.ref);
                    return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
                });
        }
        // Lazy: laad de verstekst via de OV-bibliotheek zodra een item in beeld komt
        let _io = null;
        function observeTeksten(root) {
            if (_io) _io.disconnect();
            _io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (!e.isIntersecting) return;
                    const el = e.target; _io.unobserve(el);
                    const ref = el.dataset.ref;
                    if (window.OSV) {
                        OSV.cite(ref, { link: false }).then(r => { el.innerHTML = r.html; }).catch(() => {});
                    }
                });
            }, { rootMargin: '400px' });
            root.querySelectorAll('.ond-vers-tekst[data-ref]').forEach(el => _io.observe(el));
        }
        // Onderwerpen geordend in rubrieken (zoals de wiki van de kleine ark)
        const CATEGORIEEN = [
            { id: 'spreken', label: 'Wie spreekt er in Gods Woord?', ids: ['vader-spreekt', 'zoon-spreekt', 'geest-spreekt'] },
            { id: 'kern', label: "Kernthema's van het geloof", ids: ['schepping', 'zonde', 'bekering', 'geloof', 'verbond', 'gods-leiding'] },
            { id: 'jezus', label: 'Wie is Jezus Christus?', ids: ['karakter-jezus', 'jezus-is-god'] },
            { id: 'gemeente', label: 'Gebed & gemeente', ids: ['gebed', 'gebedshouding', 'tucht-gemeente', 'evangelisatie'] },
            { id: 'liefde', label: 'Liefde', ids: ['liefde-algemeen', 'liefde-man-vrouw'] },
            { id: 'huwelijk-seks', label: 'Huwelijk & seksualiteit', ids: ['huwelijk', 'misbruik-verkrachting-en-incest', 'lhbtq'] },
            { id: 'vragen', label: 'Vragen & moeilijke onderwerpen', ids: ['apostelen-vandaag'] }
        ];
        function kaartHTML(tag) {
            const n = (tag.verzen || []).length;
            return `<button class="ond-card" data-id="${tag.id}" data-naam="${(tag.naam || '').toLowerCase()}" style="--kleur:${tag.kleur || '#999'}">
                    <h2>${tag.naam || ''}</h2>
                    ${tag.beschrijving ? `<p class="beschr">${tag.beschrijving}</p>` : ''}
                    <div class="count"><span class="count-num">${n}</span> vers${n === 1 ? '' : 'en'}<span class="count-arrow">&rsaquo;</span></div>
                </button>`;
        }
        function toonGrid() {
            detail.style.display = 'none';
            grid.style.display = '';
            zoek.style.display = '';
            if (!TAGS.length) { grid.innerHTML = '<p class="ond-empty">Nog geen onderwerpen.</p>'; return; }
            const byId = {}; TAGS.forEach(t => byId[t.id] = t);
            const gebruikt = new Set();
            const secties = CATEGORIEEN.map(cat => {
                const tags = cat.ids.map(id => byId[id]).filter(Boolean);
                tags.forEach(t => gebruikt.add(t.id));
                return { id: cat.id, label: cat.label, tags: tags };
            });
            const rest = TAGS.filter(t => !gebruikt.has(t.id))
                .sort((a, b) => (b.verzen ? b.verzen.length : 0) - (a.verzen ? a.verzen.length : 0));
            if (rest.length) secties.push({ id: 'overig', label: 'Overige onderwerpen', tags: rest });
            const zichtbaar = secties.filter(s => s.tags.length);
            const nav = `<nav class="ond-jump"><span class="ond-jump-label">Ga direct naar</span>${zichtbaar.map(s => `<a href="#cat-${s.id}">${s.label}</a>`).join('')}</nav>`;
            const secHTML = zichtbaar.map(s =>
                `<section class="ond-sectie" id="cat-${s.id}">
                    <h2 class="ond-cat-titel">${s.label}<span class="ond-cat-count">${s.tags.length}</span></h2>
                    <div class="ond-grid">${s.tags.map(kaartHTML).join('')}</div>
                </section>`).join('');
            grid.innerHTML = nav + secHTML;
            grid.querySelectorAll('.ond-card').forEach(c =>
                c.addEventListener('click', () => toonDetail(c.dataset.id)));
        }
        function toonDetail(id) {
            const tag = TAGS.find(t => t.id === id);
            if (!tag) return;
            grid.style.display = 'none';
            zoek.style.display = 'none';
            detail.style.display = '';
            const verzen = verzenVan(tag);
            document.getElementById('ond-detail-titel').innerHTML =
                `<span class="ond-dot" style="background:${tag.kleur || '#999'}"></span>${tag.naam || ''}`;
            document.getElementById('ond-detail-beschr').textContent = tag.beschrijving || '';
            document.getElementById('ond-detail-count').textContent = `${verzen.length} vers${verzen.length === 1 ? '' : 'en'}`;
            const lijst = document.getElementById('ond-detail-lijst');
            lijst.innerHTML = verzen.map(it => {
                const ster = (it.rang === 1) ? '<span class="ster">&#9733;</span> ' : '';
                const note = it.notitie ? `<span class="vnote">${it.notitie}</span>` : '';
                return `<li class="ond-vers" data-ref="${it.ref}" data-lvl="0">
                    <div class="ond-vers-kop">${ster}<a href="${refToHref(it.ref)}">${prettyRef(it.ref)}</a>${note}<button type="button" class="ctx-btn ctx-min" title="Minder verzen tonen" aria-label="Minder context" hidden>&minus;</button><button type="button" class="ctx-btn ctx-plus" title="Toon 2 verzen ervoor en erna" aria-label="Meer context eromheen">+</button></div>
                    <div class="ond-vers-tekst osv-cite" data-ref="${it.ref}" title="Klik om naar deze tekst in Gods Woord te gaan"></div>
                </li>`;
            }).join('');
            observeTeksten(lijst);
            bindLijstInteractie(lijst);
            window.scrollTo(0, 0);
            location.hash = 'tag=' + encodeURIComponent(id);
        }

        // Referentie "boek h:v" ontleden naar losse delen
        function refParts(ref) {
            const sp = ref.lastIndexOf(' ');
            const book = ref.slice(0, sp);
            const cv = ref.slice(sp + 1).split(':');
            return { book: book, ch: parseInt(cv[0], 10) || 1, v: parseInt(cv[1], 10) || 1 };
        }
        // Toon het vers met `2 × niveau` verzen ervoor en erna (binnen het hoofdstuk)
        function renderContext(li) {
            if (!window.OSV) return;
            const ref = li.dataset.ref;
            const lvl = parseInt(li.dataset.lvl, 10) || 0;
            const tekst = li.querySelector('.ond-vers-tekst');
            const p = refParts(ref);
            const span = 2 * lvl;
            const from = Math.max(1, p.v - span), to = p.v + span;
            const rangeRef = span === 0 ? `${p.book} ${p.ch}:${p.v}` : `${p.book} ${p.ch}:${from}-${to}`;
            OSV.cite(rangeRef, { link: false }).then(r => {
                tekst.innerHTML = r.html;
                if (span > 0) {
                    // Focusvers krijgt de accent-markering; verzen ervoor en erna een lichtere kleur.
                    tekst.querySelectorAll('.osv-vers').forEach(vs => {
                        const num = vs.querySelector('.osv-num');
                        const n = num ? parseInt(num.textContent, 10) : p.v;
                        vs.dataset.vnum = n;
                        vs.classList.add(n === p.v ? 'focus-vers' : 'context-vers');
                    });
                }
                const min = li.querySelector('.ctx-min');
                if (min) min.hidden = lvl <= 0;
            }).catch(() => {});
        }
        // Delegatie: +/- knoppen (context) en klik op verstekst (naar Gods Woord springen)
        function bindLijstInteractie(lijst) {
            if (lijst._interactieGebonden) return;
            lijst._interactieGebonden = true;
            lijst.addEventListener('click', e => {
                const btn = e.target.closest('.ctx-btn');
                if (btn) {
                    const li = btn.closest('.ond-vers');
                    let lvl = parseInt(li.dataset.lvl, 10) || 0;
                    lvl += btn.classList.contains('ctx-plus') ? 1 : -1;
                    if (lvl < 0) lvl = 0;
                    li.dataset.lvl = lvl;
                    renderContext(li);
                    return;
                }
                const tekstEl = e.target.closest('.ond-vers-tekst');
                if (tekstEl) {
                    const li = tekstEl.closest('.ond-vers');
                    const p = refParts(li.dataset.ref);
                    const vs = e.target.closest('.osv-vers');
                    const n = (vs && vs.dataset.vnum) ? parseInt(vs.dataset.vnum, 10) : p.v;
                    window.location.href = `index.html#${p.book}/${p.ch}/${n}`;
                }
            });
        }
        document.getElementById('ond-terug').addEventListener('click', () => { location.hash = ''; toonGrid(); });
        zoek.addEventListener('input', function () {
            const q = this.value.trim().toLowerCase();
            document.querySelectorAll('.ond-card').forEach(c => {
                c.style.display = (!q || c.dataset.naam.includes(q)) ? '' : 'none';
            });
            // Lege rubrieken (en tijdens filteren de sprong-navigatie) verbergen
            document.querySelectorAll('.ond-sectie').forEach(sec => {
                const zichtbaar = [...sec.querySelectorAll('.ond-card')].some(c => c.style.display !== 'none');
                sec.style.display = zichtbaar ? '' : 'none';
            });
            const nav = document.querySelector('.ond-jump');
            if (nav) nav.style.display = q ? 'none' : '';
        });
        function init(tags) {
            TAGS = tags || [];
            const m = (location.hash || '').match(/tag=([^&]+)/);
            if (m) toonDetail(decodeURIComponent(m[1])); else toonGrid();
        }
        // Spreker-tags (apart bestand) + onderwerp-tags samenvoegen
        Promise.all([
            fetch('data/tags.json').then(r => r.json()).catch(() => ({ tags: [] })),
            fetch('data/spreker-tags.json').then(r => r.ok ? r.json() : { tags: [] }).catch(() => ({ tags: [] })),
            fetch('data/books.json').then(r => r.json()).catch(() => ({ books: [] }))
        ]).then(([a, b, bk]) => {
            let flat = null;
            try { if (window.getFlatBookOrder) flat = getFlatBookOrder('canoniek', bk); } catch (e) {}
            if (!flat || !flat.length) flat = (bk.books || []).map(x => x.id);
            flat.forEach((id, i) => { BOOKORDER[id] = i; });
            (bk.books || []).forEach(x => { BOOKNAMES[x.id] = x.nameDutch || x.id; });
            init([...(a.tags || []), ...(b.tags || [])]);
        });
    })();
    </script>
