        var bfEl = document.getElementById('lex-bron-filter');
        if (bfEl) { bronFilter = ''; bfEl.value = ''; bfEl.style.display = taal.json2 ? '' : 'none'; }
        var zoekTerm = (location.search.match(/[?&]zoek=([^&]+)/) || [])[1];
        if (zoekTerm) zoekTerm = decodeURIComponent(zoekTerm);
        // Meteen iets tonen: de landingspagina (uitleg + alfabet) verschijnt direct
        // — óók terwijl de (soms grote) woordenlijst nog laadt. Behalve als er meteen
        // een specifiek woord geopend moet worden.
        if (!wantKey && !zoekTerm && window.LEX_LANDING && window.LEX_LANDING[taal.id])
            contentEl.innerHTML = window.LEX_LANDING[taal.id];
        else
            contentEl.innerHTML = '<p class="placeholder">Kies links een woord…</p>';
        hintEl.textContent = 'Laden…'; listEl.innerHTML = '';

        // Kop-woord -> Strong-nummer index voor onderlinge links (Grieks/Hebreeuws)
        function buildHw() {
            if (taal.abbr && !taal._hw && window[taal.global]) {
                var obj = window[taal.global], hw = {}, wre = XREF_RE[taal.id];
                if (wre) Object.keys(obj).forEach(function (k) {
                    (obj[k].woord || '').split(/[,\s]+/).forEach(function (p) {
                        p = p.trim();
                        if (p && new RegExp('^' + wre.source + '$').test(p)) {
                            var bf = baseForm(p);
                            if (bf && !(bf in hw)) hw[bf] = k;
                        }
                    });
                });
                taal._hw = hw;
            }
        }
        function renderList() { buildHw(); entries = toEntries(taal); var zk = document.getElementById('lex-zoek'); filter(zk ? zk.value : ''); }
        function tryOpen() {
            var opened = wantKey ? openKey(wantKey) : false;
            if (!opened && zoekTerm) {
                var zk = document.getElementById('lex-zoek'); zk.value = zoekTerm; filter(zoekTerm); opened = true;
            }
            if (!opened && window.LEX_LANDING && window.LEX_LANDING[cur.id]
                && !(document.getElementById('lex-zoek') && document.getElementById('lex-zoek').value))
                contentEl.innerHTML = window.LEX_LANDING[cur.id];
            history.replaceState(null, '', '?taal=' + taal.id + (opened && wantKey ? '&entry=' + encodeURIComponent(wantKey) : ''));
            return opened;
        }

        if (loaded[taal.id]) { renderList(); tryOpen(); return; }

        // Fase 1 — alleen de minimale data (klein bestand) zodat de lijst direct verschijnt.
        Promise.resolve().then(function () {
            if (taal.src) return loadScript(taal.src);
            return fetch(taal.json).then(function (r) { return r.json(); }).then(function (d) {
                taal._data = taal.json2 ? { woorden: (d.woorden || []).slice() } : d;
            });
        }).then(function () {
            if (!taal.nlJson) return;
            return fetch(taal.nlJson).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { taal._nl = d; }).catch(function () { taal._nl = {}; });
        }).then(function () {
            if (!taal.reviewedJson) return;
            return fetch(taal.reviewedJson).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) {
                taal._nl = Object.assign({}, taal._nl || {}, d);
            });
        }).then(function () {
            renderList();          // lijst is er nu al — geen wachten op het zware woordenboek
            tryOpen();
            // Fase 2 — zware tweede bron (Dillmann 21MB / Lewis&Short) + refs + lex2 op de achtergrond.
            var bg = [];
            if (taal.json2) bg.push(fetch(taal.json2).then(function (r) { return r.json(); }).then(function (d) {
                var w2 = (d.woorden || []).map(function (w) { var c = {}; for (var k in w) c[k] = w[k]; c._html = true; return c; });
                taal._data = { woorden: (taal._data.woorden || []).concat(w2) };
            }));
            if (taal.refsJson) bg.push(fetch(taal.refsJson).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { taal._refs = d; }).catch(function () { taal._refs = {}; }));
            if (taal.dnlJson) bg.push(fetch(taal.dnlJson).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { taal._dnl = d; }).catch(function () { taal._dnl = {}; }));
            if (taal.lex2) bg.push(loadScript(taal.lex2.src).then(function () {
                return fetch(taal.lex2.nlJson).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { taal.lex2._nl = d; }).catch(function () { taal.lex2._nl = {}; });
            }).then(function () {
                if (!taal.lex2.reviewedJson) return;
                return fetch(taal.lex2.reviewedJson).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) {
                    taal.lex2._nl = Object.assign({}, taal.lex2._nl || {}, d);
                });
            }));
            if (!bg.length) { loaded[taal.id] = true; return; }
            Promise.all(bg).then(function () {
                loaded[taal.id] = true;
                renderList();      // herrenderen mét het volledige woordenboek
                if (wantKey || zoekTerm) tryOpen();   // bv. een Dillmann-entry die pas nu geladen is
            }).catch(function (err) { console.error(err); loaded[taal.id] = true; });
        }).catch(function (err) { hintEl.textContent = 'Kon lexicon niet laden.'; console.error(err); });
    }

    // Tabs bouwen
    var tabsEl = document.getElementById('lex-tabs');
    tabsEl.innerHTML = TALEN.map(function (t) { return '<button class="lex-tab" data-id="' + t.id + '">' + t.label + '</button>'; }).join('');
    [].forEach.call(tabsEl.querySelectorAll('.lex-tab'), function (b) {
        b.addEventListener('click', function () { selectTaal(TALEN.filter(function (t) { return t.id === b.dataset.id; })[0]); });
    });

    fetch('data/books.json').then(function (r) { return r.json(); }).then(function (d) {
        (d.books || []).forEach(function (b) { BOOKNAMES[b.id] = b.nameDutch || b.id; CHAPTERCOUNT[b.id] = b.totalChapters || 0; });
    }).finally(function () {
        var q = (location.search.match(/taal=([\w-]+)/) || [])[1];
        var entryParam = (location.search.match(/entry=((?:[HG]\d+[A-Za-z]?|OV[GL]\d+))/) || [])[1];
        // Als een Strong-entry gevraagd is, kies automatisch de juiste taal
        if (entryParam && !q) {
            q = entryParam.indexOf('OVL') === 0 ? 'latijn'
                : entryParam.indexOf('OVG') === 0 ? 'geez'
                    : entryParam.charAt(0) === 'H' ? 'hebreeuws' : 'grieks';
        }
        var start = TALEN.filter(function (t) { return t.id === q; })[0] || TALEN[0];
        selectTaal(start, entryParam);
    });
})();
</script>
