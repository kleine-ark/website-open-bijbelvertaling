<script>
(function () {
    'use strict';
    // Taal-configuratie
    var TALEN = [
        { id: 'hebreeuws', label: 'Hebreeuws & Aramees', src: 'js/hebreeuws-woordenboek.js', global: 'bdbLexicon', nlJson: 'data/lexicon-nl/bdb-nl.json', abbr: true, bron: 'Brown-Driver-Briggs (1906), publiek domein — <a href="https://github.com/openscriptures/BrownDriverBriggs" target="_blank" rel="noopener">openscriptures/BrownDriverBriggs</a>. Nederlandse vertaling automatisch, in bewerking.' },
        { id: 'grieks', label: 'Grieks', src: 'js/grieks-tbesg.js', global: 'tbesgLexicon', nlJson: 'data/lexicon-nl/tbesg-nl.json', abbr: true, reftags: true, bron: 'TBESG — Translators Brief lexicon of Extended Strongs for Greek, <a href="https://github.com/STEPBible/STEPBible-Data" target="_blank" rel="noopener">STEP Bible</a> / Tyndale House Cambridge (CC BY 4.0). Gebaseerd op Abbott-Smith, gecorrigeerd en uitgebreid. Nederlandse vertaling automatisch, in bewerking.' },
        { id: 'latijn', label: 'Latijn', json: 'data/lexicon-latijn.json', bron: '4 Ezra (Vulgaat-traditie) — grondtekst-glossen' },
        { id: 'geez', label: "Ge'ez", json: 'data/lexicon-geez.json', bron: 'Ethiopische boeken — Beta maṣāḥǝft (CC BY-SA)' }
    ];

    // Boek-afkortingen (BDB / Abbott-Smith, Engels) -> onze boek-id
    var ABBR = {
        Gen:'genesis', Exod:'exodus', Ex:'exodus', Lev:'leviticus', Num:'numeri', Deut:'deuteronomium', Dt:'deuteronomium',
        Josh:'jozua', Jos:'jozua', Judg:'richteren', Jdg:'richteren', Ruth:'ruth',
        '1Sam':'1samuel', '2Sam':'2samuel', '1Kin':'1koningen', '1Kgs':'1koningen', '2Kin':'2koningen', '2Kgs':'2koningen',
        '1Chr':'1kronieken', '2Chr':'2kronieken', Ezra:'ezra', Neh:'nehemia', Esth:'esther', Est:'esther',
        Job:'job', Ps:'psalmen', Psa:'psalmen', Prov:'spreuken', Pr:'spreuken', Eccl:'prediker', Qoh:'prediker',
        Song:'hooglied', Cant:'hooglied', Isa:'jesaja', Jer:'jeremia', Lam:'klaagliederen', Ezek:'ezechiel', Eze:'ezechiel',
        Dan:'daniel', Hos:'hosea', Joel:'joel', Amos:'amos', Am:'amos', Obad:'obadja', Ob:'obadja', Jonah:'jona', Jon:'jona',
        Mic:'micha', Nah:'nahum', Hab:'habakuk', Zeph:'zefanja', Zep:'zefanja', Hag:'haggai', Zech:'zacharia', Zec:'zacharia', Mal:'maleachi',
        Matt:'mattheus', Mt:'mattheus', Mark:'markus', Mk:'markus', Luke:'lukas', Lk:'lukas', John:'johannes', Jn:'johannes',
        Acts:'handelingen', Rom:'romeinen', '1Cor':'1korinthiers', '2Cor':'2korinthiers', Gal:'galaten', Eph:'efeziers',
        Phil:'filippenzen', Col:'kolossenzen', '1Thess':'1tessalonicensen', '1Th':'1tessalonicensen', '2Thess':'2tessalonicensen', '2Th':'2tessalonicensen',
        '1Tim':'1timotheus', '2Tim':'2timotheus', Titus:'titus', Tit:'titus', Phlm:'filemon', Heb:'hebreeen',
        Jas:'jakobus', '1Pet':'1petrus', '2Pet':'2petrus', '1John':'1johannes', '1Jn':'1johannes', '2John':'2johannes', '3John':'3johannes', Jude:'judas', Rev:'openbaring',
        Tob:'tobit', Jth:'judith', Jdt:'judith', '1Macc':'1makkabeeen', '2Macc':'2makkabeeen', Sir:'jezussirach', Ecclus:'jezussirach', Wis:'boekderwijsheid', Bar:'baruch'
    };
    var abbrKeys = Object.keys(ABBR).sort(function (a, b) { return b.length - a.length; });
    var abbrAlt = abbrKeys.map(function (k) { return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
    // Optionele boek-afkorting gevolgd door hoofdstuk:vers (met optioneel bereik).
    // Zonder boek = "kale" verwijzing (bv. 15:20) die het laatstgenoemde boek erft.
    var refRe = new RegExp('(?:\\b(' + abbrAlt + ')\\s?)?(\\d+):(\\d+)((?:[-–]\\d+)?)', 'g');

    function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
    var BOOKNAMES = {}, CHAPTERCOUNT = {};
    function bookName(id) { return BOOKNAMES[id] || id; }

    // TBESG (Grieks) gebruikt gestructureerde <ref='Luk.4.34.'>…</ref>-tags met eigen boek-codes.
    var TBESG_BOOK = {
        Gen:'genesis', Exo:'exodus', Lev:'leviticus', Num:'numeri', Deu:'deuteronomium', Jos:'jozua',
        Jdg:'richteren', Rut:'ruth', '1Sa':'1samuel', '2Sa':'2samuel', '1Ki':'1koningen', '2Ki':'2koningen',
        '3Ki':'1koningen', '4Ki':'2koningen', '1Ch':'1kronieken', '2Ch':'2kronieken', Ezr:'ezra', Neh:'nehemia',
        Est:'esther', Job:'job', Psa:'psalmen', Pro:'spreuken', Ecc:'prediker', Sng:'hooglied', Isa:'jesaja',
        Jer:'jeremia', Lam:'klaagliederen', Ezk:'ezechiel', Dan:'daniel', Hos:'hosea', Jol:'joel', Amo:'amos',
        Oba:'obadja', Jon:'jona', Mic:'micha', Nam:'nahum', Hab:'habakuk', Zep:'zefanja', Hag:'haggai',
        Zec:'zacharia', Mal:'maleachi',
        Mat:'mattheus', Matt:'mattheus', Mrk:'markus', Mark:'markus', Luk:'lukas', Luke:'lukas', Jhn:'johannes',
        John:'johannes', Act:'handelingen', Acts:'handelingen', Rom:'romeinen', '1Co':'1korinthiers',
        '1Cor':'1korinthiers', '2Co':'2korinthiers', Gal:'galaten', Eph:'efeziers', Php:'filippenzen',
        Phil:'filippenzen', Col:'kolossenzen', '1Th':'1tessalonicensen', '2Th':'2tessalonicensen',
        '1Ti':'1timotheus', '1Tim':'1timotheus', Tim:'1timotheus', '2Ti':'2timotheus', Tit:'titus',
        Heb:'hebreeen', Jas:'jakobus', '1Pe':'1petrus', '1Pet':'1petrus', '2Pe':'2petrus', '1Jn':'1johannes',
        '1Jo':'1johannes', '2Jn':'2johannes', '3Jn':'3johannes', Jude:'judas', Rev:'openbaring',
        '1Es':'3ezra', '2Es':'4ezra', Tob:'tobit', Jdt:'judith', Wis:'boekderwijsheid', Sir:'jezussirach',
        Bar:'baruch', '1Ma':'1makkabeeen', '1Mac':'1makkabeeen', '2Ma':'2makkabeeen', '2Mac':'2makkabeeen',
        '3Ma':'3makkabeeen', '3Mac':'3makkabeeen', Man:'gebedvanmanasse', Sus:'susanna', Bel:'belenddedraak'
    };
    function linkifyTbesg(html) {
        return html.replace(/<ref='([^']+)'>([^<]*)<\/ref>/g, function (m, attr, txt) {
            var parts = attr.replace(/\.$/, '').split('.');
            var b = TBESG_BOOK[parts[0]];
            if (!b || !parts[1]) return txt || '';       // onbekende boek-code: alleen de tekst tonen
            return '<a class="lex-ref" target="_top" href="index.html#' + b + '/' + parts[1] + '/' + (parts[2] || '') + '">' + (txt || (bookName(b) + ' ' + parts[1] + ':' + (parts[2] || ''))) + '</a>';
        });
    }

    // Linkify verwijzingen in BDB/Abbott-definities: toon Nederlandse boeknaam,
    // en link ook kale vervolg-verwijzingen (die het vorige boek erven).
    function linkifyAbbr(html) {
        var lastBook = null;
        return html.replace(/>([^<]+)</g, function (m, txt) {
            var out = txt.replace(refRe, function (mm, ab, ch, vs, rng) {
                var book = null;
                if (ab && ABBR[ab]) { book = ABBR[ab]; lastBook = book; }
                if (!book) {
                    book = lastBook;               // kale verwijzing erft vorig boek
                    if (!book) return mm;          // nog geen boek-context: geen link
                    // alleen linken als het hoofdstuk in dat boek bestaat (voorkomt bv. "37:35" -> Spreuken)
                    if (CHAPTERCOUNT[book] && +ch > CHAPTERCOUNT[book]) return mm;
                }
                var disp = (ab && ABBR[ab] ? bookName(book) + ' ' : '') + ch + ':' + vs + (rng || '');
                return '<a class="lex-ref" target="_top" href="index.html#' + book + '/' + ch + '/' + vs + '">' + disp + '</a>';
            });
            return '>' + out + '<';
        });
    }
    function prettyRef(ref) { var sp = ref.lastIndexOf(' '); var b = ref.slice(0, sp); return (BOOKNAMES[b] || b) + ' ' + ref.slice(sp + 1); }
    function refHref(ref) { var sp = ref.lastIndexOf(' '); var b = ref.slice(0, sp); var cv = ref.slice(sp + 1).split(':'); return 'index.html#' + b + '/' + cv[0] + '/' + (cv[1] || ''); }

    var cur = null, entries = [], loaded = {};
    var showOrig = false, currentEntry = null;   // 'originele Engelse versie' tonen i.p.v. NL
    var listEl = document.getElementById('lex-list'), contentEl = document.getElementById('lex-content'), hintEl = document.getElementById('lex-hint');

    function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

    function toEntries(taal) {
        if (taal.global) {
            var obj = window[taal.global] || {};
            var nl = taal._nl || {};
            return Object.keys(obj).map(function (k) {
                var t = nl[k] || {};
                var defEn = obj[k].definitie || obj[k].vorm || '';
                var def = t.definitieNl || t.vormNl || defEn;
                return { key: k, woord: obj[k].woord,
                    gloss: t.glossNl || obj[k].gloss,
                    glossEn: obj[k].gloss,
                    def: def,
                    defEn: defEn,          // originele Engelse definitie (BDB/Abbott)
                    nl: !!(t.definitieNl || t.glossNl),
                    abbr: true };
            });
        }
        // JSON (latijn/geez)
        return (taal._data.woorden || []).map(function (w, i) {
            return { key: w.lemma || w.woord || ('#' + i), woord: w.woord || (w.vormen && w.vormen[0]) || w.lemma, gloss: w.betekenis, verw: w.verwijzingen || [], forms: w.vormen };
        });
    }

    function filter(q) {
        q = (q || '').toLowerCase().trim();
        var r = entries;
        if (q) r = entries.filter(function (e) {
            return (e.gloss || '').toLowerCase().indexOf(q) >= 0 || (e.woord || '').toLowerCase().indexOf(q) >= 0 ||
                (e.key || '').toLowerCase().indexOf(q) >= 0;
        });
        hintEl.textContent = r.length.toLocaleString('nl-NL') + ' woorden' + (r.length > 300 ? ' — toont eerste 300' : '');
        var slice = r.slice(0, 300);
        listEl.innerHTML = slice.map(function (e, i) {
            return '<div class="lex-toc-item" data-i="' + entries.indexOf(e) + '"><span class="lex-toc-strong">' + esc(e.key) + '</span>' +
                '<span class="lex-toc-woord" lang="' + langAttr() + '">' + esc(e.woord || '') + '</span>' +
                '<span class="lex-toc-gloss">' + esc(e.gloss || '') + '</span></div>';
        }).join('') || '<div style="padding:14px;color:#999;">Geen resultaten.</div>';
    }
    function langAttr() { return cur.id === 'grieks' ? 'grc' : cur.id === 'geez' ? 'gez' : cur.id === 'latijn' ? 'la' : 'he'; }

    function showEntry(e) {
        currentEntry = e;
        [].forEach.call(listEl.querySelectorAll('.lex-toc-item'), function (n) { n.classList.toggle('active', +n.dataset.i === entries.indexOf(e)); });
        // Kan er tussen NL en origineel Engels geschakeld worden? (alleen bij vertaalde BDB/Abbott-entries)
        var heeftEngels = !!(e.defEn && e.nl);
        var origineel = showOrig && heeftEngels;
        var gloss = origineel ? (e.glossEn || e.gloss) : e.gloss;
        var def = origineel ? e.defEn : e.def;
        var h = '<div class="lex-entry-head"><span class="lex-entry-strong">' + esc(e.key) + '</span>' +
            '<span class="lex-entry-woord" lang="' + langAttr() + '">' + esc(e.woord || '') + '</span>' +
            (gloss ? '<span class="lex-entry-gloss">' + esc(gloss) + '</span>' : '') +
            (cur.abbr && !e.nl ? '<span class="lex-concept" title="De Nederlandse vertaling van de volledige definitie volgt nog">Definitie nog niet vertaald</span>' : '') +
            (heeftEngels ? '<button class="lex-orig-toggle" id="lex-orig-toggle">' + (origineel ? '← Nederlandse versie' : 'Originele Engelse versie →') + '</button>' : '') +
            '</div>';
        if (def) {
            h += '<div class="lex-def"' + (origineel ? ' lang="en"' : '') + '>' + (cur.reftags ? linkifyTbesg(def) : cur.abbr ? linkifyAbbr(def) : esc(def)) + '</div>';
        }
        if (e.verw && e.verw.length) {
            h += '<div class="lex-verw"><strong>Voorkomens:</strong> ' + e.verw.map(function (r) {
                return '<a target="_top" href="' + refHref(r) + '">' + esc(prettyRef(r)) + '</a>';
            }).join('') + '</div>';
        }
        h += '<div class="lex-src">Bron: ' + cur.bron + '. Tekstverwijzingen zijn aanklikbaar en openen de tekst.</div>';
        contentEl.innerHTML = h;
        contentEl.scrollTop = 0;
    }

    listEl.addEventListener('click', function (e) {
        var it = e.target.closest('.lex-toc-item'); if (!it) return;
        showEntry(entries[+it.dataset.i]);
    });
    // Schakel tussen Nederlandse vertaling en originele Engelse versie
    contentEl.addEventListener('click', function (ev) {
        if (ev.target && ev.target.id === 'lex-orig-toggle') {
            showOrig = !showOrig;
            if (currentEntry) showEntry(currentEntry);
        }
    });
    document.getElementById('lex-zoek').addEventListener('input', function () { filter(this.value); });

    function openKey(key) {
        var e = entries.filter(function (x) { return x.key === key; })[0];
        if (!e) return false;
        // toon zoekterm zodat het item in de lijst zichtbaar is
        var zoek = document.getElementById('lex-zoek');
        zoek.value = key; filter(key);
        showEntry(e);
        var it = listEl.querySelector('.lex-toc-item[data-i="' + entries.indexOf(e) + '"]');
        if (it) it.scrollIntoView({ block: 'center' });
        return true;
    }

    function selectTaal(taal, wantKey) {
        cur = taal;
        [].forEach.call(document.querySelectorAll('.lex-tab'), function (b) { b.classList.toggle('active', b.dataset.id === taal.id); });
        contentEl.innerHTML = '<p class="placeholder">Kies links een woord…</p>';
        hintEl.textContent = 'Laden…'; listEl.innerHTML = '';
        var ready = loaded[taal.id] ? Promise.resolve() :
            Promise.resolve()
                .then(function () { return taal.src ? loadScript(taal.src) : fetch(taal.json).then(function (r) { return r.json(); }).then(function (d) { taal._data = d; }); })
                .then(function () {
                    if (!taal.nlJson) return;
                    return fetch(taal.nlJson).then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { taal._nl = d; }).catch(function () { taal._nl = {}; });
                });
        ready.then(function () {
            loaded[taal.id] = true;
            entries = toEntries(taal);
            document.getElementById('lex-zoek').value = '';
            filter('');
            var opened = wantKey ? openKey(wantKey) : false;
            history.replaceState(null, '', '?taal=' + taal.id + (opened ? '&entry=' + encodeURIComponent(wantKey) : ''));
        }).catch(function (err) { hintEl.textContent = 'Kon lexicon niet laden.'; console.error(err); });
    }

    // Tabs bouwen
    var tabsEl = document.getElementById('lex-tabs');
    tabsEl.innerHTML = TALEN.map(function (t) { return '<button class="lex-tab" data-id="' + t.id + '">' + t.label + '</button>'; }).join('');
    [].forEach.call(tabsEl.querySelectorAll('.lex-tab'), function (b) {
        b.addEventListener('click', function () { selectTaal(TALEN.filter(function (t) { return t.id === b.dataset.id; })[0]); });
    });

    fetch('data/books.json').then(function (r) { return r.json(); }).then(function (d) {
        (d.books || []).forEach(function (b) { BOOKNAMES[b.id] = b.nameDutch || b.id; CHAPTERCOUNT[b.id] = b.totalChapters || 0; });
    }).finally(function () {
        var q = (location.search.match(/taal=(\w+)/) || [])[1];
        var entryParam = (location.search.match(/entry=([HG]\d+)/) || [])[1];
        // Als een Strong-entry gevraagd is, kies automatisch de juiste taal
        if (entryParam && !q) q = entryParam.charAt(0) === 'H' ? 'hebreeuws' : 'grieks';
        var start = TALEN.filter(function (t) { return t.id === q; })[0] || TALEN[0];
        selectTaal(start, entryParam);
    });
})();
</script>
<script>(function(){var b=document.getElementById('topnav-theme-toggle');if(!b)return;b.addEventListener('click',function(){try{var s=JSON.parse(localStorage.getItem('sv2026_vertaalopties')||'{}');var cur=document.documentElement.dataset.theme==='donker'?'licht':'donker';s.thema=cur;localStorage.setItem('sv2026_vertaalopties',JSON.stringify(s));document.documentElement.setAttribute('data-theme',cur);}catch(e){}});})();</script>
