[package]
name = "open-staten-vertaling"
version = "0.21.0"
description = "Open Staten Vertaling — desktop-app"
authors = ["De Kleine Ark"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "osv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
